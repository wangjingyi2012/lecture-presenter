<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>编号要点清单</title><style>
:root{--text:#0f172a;--muted:#64748b;--primary:#002855;--blue:#0369a1;--line:#dbe3ec;--surface:#f8fafc;--green:#047857;--amber:#b45309}
*{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;background:#fff;color:var(--text);font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}.ppt-container,.slide{width:100%;height:100%}.slide{position:relative;border-top:.7vh solid var(--primary)}.page-header{position:absolute;top:4vh;left:6vw;right:6vw;padding-bottom:1.4vh;border-bottom:.35vh solid var(--primary)}.page-title{margin:0;font-size:2.8vw;line-height:1.15;font-weight:900}.content-area{position:absolute;top:14vh;bottom:10vh;left:6vw;right:6vw;font-size:1.8vw}.lead{margin:0!important;color:var(--muted);font-size:1.8vw;line-height:1.35}.point-list{position:absolute;left:0;right:0;top:7vh;bottom:8vh;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;column-gap:2vw;row-gap:1.5vh}.point-item{display:grid;grid-template-columns:4.2vw 1fr auto;align-items:center;gap:1.1vw;padding:1.4vh 1.2vw;border:.1vw solid var(--line);border-radius:.5vw;background:rgba(255,255,255,.92);box-shadow:0 .35vh 1vh rgba(15,23,42,.06)}.point-number{color:#94a3b8;font-size:2.5vw;font-weight:900}.point-copy strong{display:block;color:var(--primary);font-size:1.9vw;line-height:1.2}.point-copy span{display:block;margin-top:.45vh;color:#334155;font-size:1.75vw;line-height:1.35}.point-tag{min-width:4.5vw;padding:.45vh .55vw;border-radius:.4vw;background:#e0f2fe;color:var(--blue);font-size:1.5vw;font-weight:900;text-align:center}.point-item:nth-child(3n+2) .point-tag{background:#ecfdf5;color:var(--green)}.point-item:nth-child(3n) .point-tag{background:#fffbeb;color:var(--amber)}.takeaway{position:absolute;left:7vw;right:7vw;bottom:.2vh;padding:.9vh 1.2vw;border:.1vw solid #bfdbfe;border-radius:.55vw;background:#eff6ff;color:var(--primary);font-size:1.8vw;line-height:1.35;font-weight:900;text-align:center}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="ppt-container"><div class="slide"><header class="page-header"><h1 class="page-title" data-title></h1></header><main class="content-area" data-template="numbered-key-points"><p class="lead" data-lead></p><section class="point-list" data-items></section><div class="takeaway" data-takeaway></div></main></div></div><script type="application/json" id="template-data">{"title":"API 设计的四条稳定原则","lead":"接口易用性来自长期一致，而不是单个接口的局部便利。","items":[{"label":"资源命名","detail":"路径使用稳定名词，动作通过 HTTP 方法表达。","tag":"语义"},{"label":"错误结构","detail":"错误码、消息和定位字段保持统一，调用方可以集中处理。","tag":"一致"},{"label":"兼容策略","detail":"新增字段保持可选，破坏性变化进入明确的新版本。","tag":"演进"},{"label":"请求追踪","detail":"每次调用携带请求标识，日志与上下游链路可以关联。","tag":"诊断"}],"takeaway":"稳定契约降低调用成本，也降低服务端演进成本。"}</script><script>(()=>{const data=JSON.parse(document.getElementById('template-data').textContent),root=document.querySelector('[data-template]'),put=(s,v)=>{const n=document.querySelector(s);if(n&&v!=null)n.textContent=v};put('[data-title]',data.title);put('[data-lead]',data.lead);put('[data-takeaway]',data.takeaway);(data.items||[]).slice(0,6).forEach((item,index)=>{const node=document.createElement('article');node.className='point-item';node.dataset.pointItem='';node.innerHTML='<span class="point-number"></span><div class="point-copy"><strong></strong><span></span></div><span class="point-tag"></span>';node.querySelector('.point-number').textContent=String(index+1).padStart(2,'0');node.querySelector('strong').textContent=item.label;node.querySelector('.point-copy span').textContent=item.detail;node.querySelector('.point-tag').textContent=item.tag||'';root.querySelector('[data-items]').appendChild(node)})})();</script></body></html>
