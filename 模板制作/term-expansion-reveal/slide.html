<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>术语展开讲解页</title>
  <style>
    :root { --text:#1f2937; --muted:#475569; --primary:#1e40af; --emphasis:#b91c1c; --line:#cbd5e1; --surface:#fff; --terminal-surface:#f8fafc; --terminal-text:#1f2937; }
    * { box-sizing:border-box; }
    body { margin:0; width:100vw; height:100vh; background:var(--surface); color:var(--text); font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif; }
    .ppt-container, .slide { width:100%; height:100%; }
    .slide { position:relative; background:var(--surface); border-top:0.7vh solid var(--primary); }
    .page-header { position:absolute; top:4vh; left:6vw; right:6vw; padding-bottom:1.4vh; border-bottom:0.35vh solid var(--primary); }
    .page-title { margin:0; font-size:2.5vw; line-height:1.15; font-weight:900; letter-spacing:0; }
    .content-area { position:absolute; top:14vh; bottom:9vh; left:6vw; right:6vw; font-size:1.8vw; }
    .term-reveal { display:flex; justify-content:center; margin:2vh 0 2.5vh; text-align:center; }
    .term-name { display:inline-block; max-width:100%; cursor:pointer; user-select:none; font-size:4vw; line-height:1.15; font-weight:800; letter-spacing:0; }
    .term-word { display:inline-block; white-space:nowrap; }
    .term-initial { color:var(--text); transition:color .55s ease; }
    .term-rest { display:inline-block; max-width:0; overflow:hidden; vertical-align:bottom; color:var(--text); transition:max-width .65s ease-out; }
    .term-name[data-state="expanded"] .term-initial { color:var(--emphasis); }
    .term-name[data-state="expanded"] .term-rest { max-width:18vw; }
    .term-name[data-state="expanded"] .term-word:not(:last-child) { margin-right:.35em; }
    .definition { opacity:0; transform:translateY(-0.6vh); pointer-events:none; margin:0 0 2.5vh; padding:1.6vh 2vw; border:1px solid var(--line); border-radius:8px; background:#f8fafc; font-size:1.8vw; line-height:1.5; font-weight:600; transition:opacity .5s ease, transform .5s ease; }
    .definition.revealed { opacity:1; transform:translateY(0); pointer-events:auto; }
    .example { opacity:0; transform:translateY(-0.6vh); pointer-events:none; transition:opacity .5s ease, transform .5s ease; }
    .example.revealed { opacity:1; transform:translateY(0); pointer-events:auto; }
    .example-title { margin:0 0 1vh; font-size:2vw; color:var(--primary); }
    .terminal { border:1px solid var(--line); border-radius:8px; background:var(--terminal-surface); overflow:auto; }
    .terminal-header { display:flex; gap:.6vw; align-items:center; padding:1vh 1.4vw; border-bottom:1px solid #e2e8f0; background:#f1f5f9; }
    .dot { width:.8vw; height:.8vw; border-radius:50%; }
    .dot.red { background:#ef4444; } .dot.yellow { background:#f59e0b; } .dot.green { background:#22c55e; }
    .terminal-body { padding:1.6vh 1.6vw; color:var(--terminal-text); font-family:"SF Mono",Monaco,Consolas,monospace; font-size:1.6vw; line-height:1.55; white-space:pre-wrap; }
    .prompt { color:#64748b; user-select:none; } .command { color:var(--primary); font-weight:700; } .output { color:#475569; } .result { color:#15803d; font-weight:700; }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <div class="ppt-container"><div class="slide">
    <header class="page-header"><h1 class="page-title" data-slot="title">CLI 的含义</h1></header>
    <main class="content-area" data-template="term-expansion-reveal" data-step="0" data-max-step="2">
      <div class="term-reveal"><div class="term-name" data-term-name data-state="compact" role="button" tabindex="0" aria-label="展开术语"><span data-term-initials></span><span data-term-rest></span></div></div>
      <div class="definition" data-definition aria-hidden="true">CLI 是通过文本命令使用程序的方式：用户输入命令，操作系统启动进程，结果回显到屏幕。</div>
      <section class="example" data-example aria-hidden="true"><h2 class="example-title" data-example-title>在源码中搜索 TODO</h2><div class="terminal" data-example-terminal><div class="terminal-header"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div><div class="terminal-body"><span class="prompt">$ </span><span class="command" data-example-command>grep -rn &quot;TODO&quot; src/</span><span data-example-lines></span><span class="result" data-example-result>3 matches</span></div></div></section>
    </main>
  </div></div>
  <script type="application/json" id="template-data">
    {"title":"CLI 的含义","term":{"initials":["C","L","I"],"words":["ommand","ine","nterface"],"fullName":"Command Line Interface"},"definition":"CLI 是通过文本命令使用程序的方式：用户输入命令，操作系统启动进程，结果回显到屏幕。","example":{"kind":"terminal","title":"在源码中搜索 TODO","command":"grep -rn \"TODO\" src/","lines":["handler.ts:42:// TODO: handle null case","utils.ts:8:// TODO: refactor this","index.ts:15:// TODO: add help text"],"result":"3 matches"}}
  </script>
  <script>
    (() => {
      const data = JSON.parse(document.getElementById('template-data').textContent);
      const root = document.querySelector('[data-template="term-expansion-reveal"]');
      const scope = root.closest('.slide');
      const setText = (selector, value) => { const node = scope.querySelector(selector); if (node && value != null) node.textContent = value; };
      setText('[data-slot="title"]', data.title); setText('[data-definition]', data.definition);
      const term = data.term || {}; const initials = Array.isArray(term.initials) ? term.initials : []; const words = Array.isArray(term.words) ? term.words : [];
      const initialsEl = root.querySelector('[data-term-initials]'); const restEl = root.querySelector('[data-term-rest]');
      initials.forEach((initial, index) => { const word = document.createElement('span'); word.className = 'term-word'; const initialEl = document.createElement('span'); initialEl.className = 'term-initial'; initialEl.textContent = initial; const rest = document.createElement('span'); rest.className = 'term-rest'; rest.textContent = words[index] || ''; word.append(initialEl, rest); initialsEl.appendChild(word); });
      const example = data.example && data.example.kind && data.example.kind !== 'none' ? data.example : null;
      const exampleEl = root.querySelector('[data-example]');
      if (!example || example.kind !== 'terminal') { exampleEl.remove(); root.dataset.maxStep = '1'; }
      else { setText('[data-example-title]', example.title); setText('[data-example-command]', example.command); setText('[data-example-result]', example.result); const lines = root.querySelector('[data-example-lines]'); (example.lines || []).forEach(line => { const span = document.createElement('span'); span.className = 'output'; span.textContent = `\n${line}`; lines.appendChild(span); }); }
      const name = root.querySelector('[data-term-name]'); const definition = root.querySelector('[data-definition]'); const maxStep = Number(root.dataset.maxStep || 2); let step = 0;
      function render(next) { step = Math.max(0, Math.min(maxStep, next)); root.dataset.step = String(step); const expanded = step >= 1; name.dataset.state = expanded ? 'expanded' : 'compact'; definition.classList.toggle('revealed', expanded); definition.setAttribute('aria-hidden', expanded ? 'false' : 'true'); if (exampleEl.isConnected) { exampleEl.classList.toggle('revealed', step >= 2); exampleEl.setAttribute('aria-hidden', step >= 2 ? 'false' : 'true'); } }
      function advance() { if (step < maxStep) render(step + 1); }
      name.addEventListener('click', advance); name.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); advance(); } });
      document.addEventListener('keydown', event => { if (['ArrowRight', 'PageDown', ' '].includes(event.key) && step < maxStep) { event.preventDefault(); advance(); } else if (['ArrowLeft', 'PageUp'].includes(event.key) && step > 0) { event.preventDefault(); render(step - 1); } });
      render(0);
    })();
  </script>
</body>
</html>
