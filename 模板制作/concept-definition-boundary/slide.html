<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>概念定义与适用边界</title><style>
:root{--text:#0f172a;--muted:#64748b;--primary:#002855;--blue:#0369a1;--line:#cbd5e1;--surface:#f8fafc;--boundary:#9f1239}
*{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;background:#fff;color:var(--text);font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}.ppt-container,.slide{width:100%;height:100%}.slide{position:relative;border-top:.7vh solid var(--primary)}.page-header{position:absolute;top:4vh;left:6vw;right:6vw;padding-bottom:1.4vh;border-bottom:.35vh solid var(--primary)}.page-title{margin:0;font-size:2.8vw;line-height:1.15;font-weight:900}.content-area{position:absolute;top:14vh;bottom:10vh;left:6vw;right:6vw;font-size:1.8vw}.definition-layout{height:100%;display:grid;grid-template-columns:27vw 1fr;gap:3.2vw;align-items:stretch}.term-panel{display:flex;flex-direction:column;justify-content:center;padding:3vh 2vw;border-right:.18vw solid #93c5fd;background:#f0f7ff}.term-label{color:var(--muted);font-size:1.5vw;font-weight:900}.term{margin:1.5vh 0 1vh;color:var(--primary);font-size:4vw;line-height:1.1;font-weight:900}.formal-name{color:var(--blue);font-size:1.8vw;font-weight:900}.definition-body{display:flex;flex-direction:column;justify-content:center;min-width:0}.definition-kicker{color:var(--blue);font-size:1.5vw;font-weight:900}.definition{margin:1.1vh 0 3vh;font-size:2.25vw;line-height:1.45;font-weight:900}.attribute-list{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw}.attribute{min-height:15vh;padding:1.5vh 1vw;border-top:.15vw solid var(--primary);background:var(--surface)}.attribute strong{display:block;margin-bottom:.9vh;color:var(--primary);font-size:1.8vw}.attribute span{display:block;color:#334155;font-size:1.8vw;line-height:1.4}.boundary{margin-top:2.5vh;padding:1.2vh 1.2vw;border:.1vw solid #fda4af;border-radius:.55vw;background:#fff1f2;color:var(--boundary);font-size:1.8vw;line-height:1.4;font-weight:900}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="ppt-container"><div class="slide"><header class="page-header"><h1 class="page-title" data-title></h1></header><main class="content-area" data-template="concept-definition-boundary"><section class="definition-layout"><aside class="term-panel"><div class="term-label">术语</div><div class="term" data-term></div><div class="formal-name" data-formal-name></div></aside><section class="definition-body"><div class="definition-kicker">定义</div><div class="definition" data-definition></div><div class="attribute-list" data-attributes></div><div class="boundary"><span>适用边界：</span><span data-boundary></span></div></section></section></main></div></div><script type="application/json" id="template-data">{"title":"幂等性","term":"幂等","formalName":"Idempotency","definition":"同一个请求执行一次或多次，系统得到的业务结果保持一致。","attributes":[{"label":"对象","detail":"具有稳定业务标识的写请求"},{"label":"目标","detail":"避免重试造成重复扣款、重复创建或重复通知"},{"label":"实现","detail":"幂等键、唯一约束或已处理请求记录"}],"boundary":"幂等不等于只执行一次；系统可以重复执行，但不能产生额外业务结果。"}</script><script>(()=>{const data=JSON.parse(document.getElementById('template-data').textContent),root=document.querySelector('[data-template]'),put=(s,v)=>{const n=document.querySelector(s);if(n&&v!=null)n.textContent=v};put('[data-title]',data.title);put('[data-term]',data.term);put('[data-formal-name]',data.formalName);put('[data-definition]',data.definition);put('[data-boundary]',data.boundary);const items=(data.attributes||[]).slice(0,4),list=root.querySelector('[data-attributes]');list.style.gridTemplateColumns=`repeat(${items.length===4?2:Math.max(1,items.length)},1fr)`;items.forEach(item=>{const node=document.createElement('div');node.className='attribute';node.dataset.attribute='';node.innerHTML='<strong></strong><span></span>';node.querySelector('strong').textContent=item.label;node.querySelector('span').textContent=item.detail;list.appendChild(node)})})();</script></body></html>
