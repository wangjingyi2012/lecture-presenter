<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    :root{--text:#0f172a;--muted:#64748b;--primary:#002855;--query:#0284c7;--emphasis:#f59e0b;--line:#cbd5e1;--surface:#fff;--summary:#f0f9ff}
    *{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;background:#fff;color:var(--text);font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}.ppt-container,.slide{width:100%;height:100%}.slide{position:relative;background:var(--surface);border-top:.7vh solid var(--primary)}.page-header{position:absolute;top:4vh;left:6vw;right:6vw;padding-bottom:1.4vh;border-bottom:.35vh solid var(--primary)}.page-title{margin:0;font-size:2.5vw;line-height:1.15;font-weight:900}.content-area{position:absolute;top:14vh;bottom:8vh;left:6vw;right:6vw}.attention-stage{position:relative;width:100%;height:100%;cursor:pointer;user-select:none}.image-phase,.value-phase{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .42s ease,transform .42s ease,visibility .42s ease}.image-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw;width:88vw}.image-cell{position:relative;aspect-ratio:4/3;border-radius:.6vw;overflow:hidden;border:.08vw solid #e2e8f0;background:#f8fafc;box-shadow:0 .3vh .9vh rgba(0,0,0,.05);transition:opacity .36s ease,transform .36s ease,border-color .36s ease,box-shadow .36s ease,filter .36s ease}.image-cell img{width:100%;height:100%;object-fit:cover;display:block}.image-cell.zoomable{cursor:zoom-in}.key-panel{position:absolute;left:.55vw;right:.55vw;bottom:.65vh;min-height:4.8vh;padding:.45vh .55vw;border-radius:.5vw;background:rgba(255,255,255,.93);border:.1vw solid rgba(148,163,184,.75);color:#334155;font-size:1.5vw;line-height:1.25;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transform:translateY(6vh);transition:opacity .32s ease,transform .32s ease}.weight-pill{position:absolute;top:.7vh;right:.6vw;min-width:4.5vw;padding:.3vh .55vw;border-radius:99vw;background:rgba(15,23,42,.84);color:#fff;font-size:1.5vw;line-height:1.25;font-weight:900;text-align:center;opacity:0;transform:scale(.65);transition:opacity .3s ease,transform .3s ease}.image-cell.target .key-panel{border-color:#fb923c;color:#9a3412;background:rgba(255,247,237,.95)}.image-cell.target .weight-pill{background:var(--emphasis);color:#0f172a}.step-2 .key-panel,.step-3 .key-panel{opacity:1;transform:translateY(0)}.step-3 .weight-pill{opacity:1;transform:scale(1)}.step-3 .image-cell:not(.target){opacity:.42;filter:grayscale(.4)}.step-3 .image-cell.target{transform:translateY(-.7vh) scale(1.025);border-color:var(--emphasis);box-shadow:0 .9vh 2.1vh rgba(245,158,11,.26);z-index:4}.query-banner{position:absolute;top:.3vh;left:50%;z-index:8;min-width:29vw;min-height:5.8vh;padding:.7vh 1.4vw;border-radius:.8vw;border:.12vw solid #38bdf8;background:#fff;box-shadow:0 .7vh 1.8vh rgba(2,132,199,.13);display:flex;align-items:center;justify-content:center;gap:.8vw;opacity:0;visibility:hidden;transform:translate(-50%,-1.6vh);transition:opacity .32s ease,transform .32s ease,visibility .32s ease}.step-1 .query-banner,.step-2 .query-banner,.step-3 .query-banner{opacity:1;visibility:visible;transform:translate(-50%,0)}.query-banner .term{font-size:1.55vw;font-weight:900;color:var(--query)}.query-banner .query-text{font-size:1.9vw;font-weight:900;color:#0f172a}.query-banner .query-text strong{color:#c2410c}.match-caption{position:absolute;top:.3vh;right:.7vw;z-index:7;width:23vw;min-height:5.8vh;padding:.7vh 1vw;border-radius:.8vw;border:.1vw solid var(--line);background:#f8fafc;color:#475569;font-size:1.5vw;line-height:1.3;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .3s ease}.step-3 .match-caption{opacity:1}.value-phase{opacity:0;visibility:hidden;transform:translateX(4vw);padding-bottom:4.5vh}.step-4 .image-phase{opacity:0;visibility:hidden;transform:translateX(-4vw)}.step-4 .value-phase{opacity:1;visibility:visible;transform:translateX(0)}.value-layout{width:78vw;display:grid;grid-template-columns:27vw 5vw 38vw;align-items:center;justify-content:center;gap:1.5vw}.selected-value{position:relative;height:46vh;border-radius:1vw;overflow:hidden;border:.16vw solid var(--emphasis);background:#f8fafc;box-shadow:0 1vh 2.4vh rgba(245,158,11,.2)}.selected-value img{width:100%;height:100%;object-fit:cover;display:block}.selected-weight{position:absolute;top:1.1vh;right:.9vw;padding:.45vh .8vw;border-radius:99vw;background:var(--emphasis);color:#0f172a;font-size:1.5vw;font-weight:900}.value-arrow{width:4vw;height:4vw;color:var(--query);justify-self:center}.value-arrow svg{width:100%;height:100%;display:block}.profile-card{min-height:40vh;padding:2.2vh 2vw;border-radius:1vw;border:.12vw solid var(--line);background:#fff;box-shadow:0 .8vh 2vh rgba(15,23,42,.08);display:flex;flex-direction:column;justify-content:center;gap:1.4vh}.profile-kicker{color:var(--query);font-size:1.55vw;font-weight:900;letter-spacing:.08em}.profile-name{color:#0f172a;font-size:3vw;line-height:1.2;font-weight:900}.profile-row{display:grid;grid-template-columns:5.5vw 1fr;gap:.8vw;align-items:start;font-size:1.7vw;line-height:1.45}.profile-row .label{color:var(--muted);font-weight:800}.profile-row .content{color:#1e293b;font-weight:700}.value-summary{position:absolute;left:50%;bottom:9.2vh;transform:translateX(-50%);width:72vw;min-height:5.4vh;padding:.7vh 1.2vw;border-radius:.7vw;border:.1vw solid #bae6fd;background:var(--summary);color:#075985;font-size:1.65vw;line-height:1.3;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center}.term-rail{position:absolute;left:50%;bottom:.15vh;transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:.45vw}.term-node{appearance:none;min-width:8.6vw;min-height:5.2vh;padding:.4vh .75vw;border:.1vw solid var(--line);border-radius:.65vw;background:#fff;color:var(--muted);font-family:inherit;font-size:1.5vw;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15vh;line-height:1.08;white-space:nowrap;transition:color .25s ease,background .25s ease,border-color .25s ease,transform .25s ease}.term-node .term-main,.term-node .term-sub{display:block;white-space:nowrap}.term-node.active{color:#fff;background:var(--primary);border-color:var(--primary);transform:translateY(-.35vh)}.term-arrow{color:var(--muted);font-size:1.8vw;font-weight:900}.scene-progress{position:absolute;right:.2vw;bottom:.2vh;display:flex;gap:.55vw;z-index:12}.scene-progress span{width:.62vw;height:.62vw;border-radius:99vw;background:var(--line);transition:width .25s ease,background .25s ease}.scene-progress span.active{width:2vw;background:var(--primary)}.img-overlay{position:fixed;inset:0;background:rgba(2,6,23,.9);display:none;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out}.img-overlay.active{display:flex}.img-overlay img{max-width:92vw;max-height:92vh;object-fit:contain;border-radius:.8vw}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="ppt-container"><div class="slide"><header class="page-header"><h1 class="page-title" data-slot="title">图片注意力的计算过程</h1></header><main class="content-area" data-template="image-attention-focus" data-step="0" data-max-step="4"><div class="attention-stage" id="attentionStage"><div class="image-phase"><div class="query-banner"><span class="term">Query</span><span class="query-text">检索目标：<strong data-query>人物</strong></span></div><div class="match-caption">匹配程度越高，权重越大</div><div class="image-grid" data-image-grid></div></div><div class="value-phase" aria-hidden="true"><div class="value-layout"><div class="selected-value"><img class="zoomable" data-selected-image alt=""><div class="selected-weight" data-selected-weight></div></div><div class="value-arrow" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 32h45M40 18l14 14-14 14"/></svg></div><div class="profile-card"><div class="profile-kicker" data-selected-kicker>VALUE | 实际内容</div><div class="profile-name" data-selected-name></div><div class="profile-fields" data-selected-fields></div></div></div><div class="value-summary" data-slot="takeaway"></div></div><div class="term-rail"><button class="term-node" type="button" data-target-step="1"><span class="term-main">Query</span><span class="term-sub">检索目标</span></button><span class="term-arrow">→</span><button class="term-node" type="button" data-target-step="2"><span class="term-main">Key</span><span class="term-sub">匹配特征</span></button><span class="term-arrow">→</span><button class="term-node" type="button" data-target-step="3"><span class="term-main">权重</span><span class="term-sub">匹配程度</span></button><span class="term-arrow">→</span><button class="term-node" type="button" data-target-step="4"><span class="term-main">Value</span><span class="term-sub">实际内容</span></button></div><div class="scene-progress"><span></span><span></span><span></span><span></span><span></span></div></div></main></div></div>
  <div class="img-overlay" id="imgOverlay"><img id="imgOverlayTarget" alt="放大的图片"></div>
  <script type="application/json" id="template-data">{"title":"图片注意力的计算过程","query":"人物","images":[{"src":"assets/normal1.png","alt":"抽象纹理","labels":"纹理 · 抽象","weight":0.02},{"src":"assets/normal2.png","alt":"模糊背景","labels":"模糊 · 背景","weight":0.01},{"src":"assets/attention1.png","alt":"人物示例一","labels":"人物 · 女性 · 演员","weight":0.78,"target":true},{"src":"assets/normal3.png","alt":"墙面纹理","labels":"墙面 · 纹理","weight":0.02},{"src":"assets/normal4.png","alt":"颗粒背景","labels":"颗粒 · 背景","weight":0.01},{"src":"assets/attention2.png","alt":"人物示例二","labels":"人物 · 男性 · 运动员","weight":0.08},{"src":"assets/normal5.png","alt":"裂纹墙面","labels":"墙面 · 裂纹","weight":0.03},{"src":"assets/normal7.png","alt":"线条图形","labels":"线条 · 抽象","weight":0.05}],"selectedValue":{"image":"assets/attention1.png","alt":"高权重图片","weight":0.78,"kicker":"VALUE | 实际内容","name":"人物示例一","fields":[{"label":"类别","value":"人物"},{"label":"特征","value":"女性、演员"},{"label":"作用","value":"为结果提供主要内容"}]},"takeaway":"权重越高，图片内容对最终结果的贡献越大"}</script>
  <script>
    (() => { const data=JSON.parse(document.getElementById('template-data').textContent); const root=document.querySelector('[data-template="image-attention-focus"]'); const stage=document.getElementById('attentionStage'); const setText=(sel,val)=>{const n=root.querySelector(sel);if(n&&val!=null)n.textContent=val;}; setText('[data-slot="title"]',data.title);setText('[data-query]',data.query);setText('[data-slot="takeaway"]',data.takeaway); const images=Array.isArray(data.images)?data.images.slice(0,8):[]; const grid=root.querySelector('[data-image-grid]'); images.forEach(item=>{const cell=document.createElement('div');cell.className=`image-cell${item.target?' target':''}`;cell.dataset.imageItem='';const img=document.createElement('img');img.className='zoomable';img.src=item.src;img.alt=item.alt||'';const key=document.createElement('div');key.className='key-panel';key.textContent=item.labels||'';const weight=document.createElement('div');weight.className='weight-pill';weight.textContent=Number(item.weight||0).toFixed(2);cell.append(img,key,weight);grid.appendChild(cell);}); const selected=data.selectedValue||null; if(selected){const img=root.querySelector('[data-selected-image]');img.src=selected.image;img.alt=selected.alt||'';setText('[data-selected-weight]',`权重 ${Number(selected.weight||0).toFixed(2)}`);setText('[data-selected-kicker]',selected.kicker||'VALUE | 实际内容');setText('[data-selected-name]',selected.name||'');const fields=root.querySelector('[data-selected-fields]');(selected.fields||[]).forEach(field=>{const row=document.createElement('div');row.className='profile-row';row.innerHTML='<span class="label"></span><span class="content"></span>';row.querySelector('.label').textContent=field.label||'';row.querySelector('.content').textContent=field.value||'';fields.appendChild(row);});}else{root.querySelector('.value-phase').remove();root.querySelectorAll('[data-target-step="4"],.term-arrow:last-of-type').forEach(n=>n.remove());root.dataset.maxStep='3';} const nodes=[...root.querySelectorAll('[data-target-step]')];const dots=[...root.querySelectorAll('.scene-progress span')];let current=0;function render(next){current=Math.max(0,Math.min(Number(root.dataset.maxStep||4),next));stage.className=`attention-stage step-${current}`;root.dataset.step=String(current);nodes.forEach(node=>node.classList.toggle('active',Number(node.dataset.targetStep)===current));dots.forEach((dot,index)=>dot.classList.toggle('active',index===current));}function go(next){if(next===current)return;render(next)}function forward(){if(current<Number(root.dataset.maxStep||4))go(current+1)}function backward(){if(current>0)go(current-1)}stage.addEventListener('click',event=>{if(event.target.closest('.term-node,.zoomable,.img-overlay'))return;forward()});nodes.forEach(node=>node.addEventListener('click',event=>{event.stopPropagation();go(Number(node.dataset.targetStep))}));document.addEventListener('keydown',event=>{if(['ArrowRight','PageDown',' '].includes(event.key)&&current<Number(root.dataset.maxStep||4)){event.preventDefault();forward();}else if(['ArrowLeft','PageUp'].includes(event.key)&&current>0){event.preventDefault();backward();}});const overlay=document.getElementById('imgOverlay');const overlayTarget=document.getElementById('imgOverlayTarget');root.querySelectorAll('.zoomable').forEach(img=>img.addEventListener('click',event=>{event.stopPropagation();overlayTarget.src=img.src;overlay.classList.add('active');}));overlay.addEventListener('click',()=>overlay.classList.remove('active'));document.addEventListener('keydown',event=>{if(event.key==='Escape')overlay.classList.remove('active');});render(0); })();
  </script>
</body>
