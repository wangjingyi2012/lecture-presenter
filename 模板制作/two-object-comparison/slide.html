<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>双对象逐项对照</title><style>
:root{--text:#0f172a;--muted:#64748b;--primary:#002855;--left:#0369a1;--right:#b91c1c;--line:#dbe3ec;--soft:#f8fafc}
*{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;background:#fff;color:var(--text);font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}.ppt-container,.slide{width:100%;height:100%}.slide{position:relative;border-top:.7vh solid var(--primary)}.page-header{position:absolute;top:4vh;left:6vw;right:6vw;padding-bottom:1.4vh;border-bottom:.35vh solid var(--primary)}.page-title{margin:0;font-size:2.8vw;line-height:1.15;font-weight:900}.content-area{position:absolute;top:14vh;bottom:10vh;left:6vw;right:6vw;font-size:1.8vw}.comparison{height:100%;display:flex;flex-direction:column;justify-content:center}.object-heads{display:grid;grid-template-columns:1fr 9vw 1fr;align-items:stretch;margin-bottom:1.3vh}.object{padding:1.35vh 1.2vw;border:.12vw solid;border-radius:.55vw;text-align:center}.object.left{border-color:#7dd3fc;background:#f0f9ff;color:var(--left)}.object.right{border-color:#fda4af;background:#fff1f2;color:var(--right)}.object strong{display:block;font-size:2.15vw;line-height:1.2}.object span{display:block;margin-top:.4vh;color:#475569;font-size:1.55vw;font-weight:800}.rows{display:flex;flex-direction:column;justify-content:center;gap:.8vh}.dimension{display:grid;grid-template-columns:1fr 9vw 1fr;align-items:stretch;min-height:8.2vh}.dimension .value{display:flex;align-items:center;padding:1vh 1.2vw;border:.1vw solid var(--line);border-radius:.45vw;color:#263548;font-size:1.75vw;line-height:1.35;background:rgba(255,255,255,.9)}.dimension .value.left{justify-content:flex-end;text-align:right;border-color:#bae6fd;background:#f8fdff}.dimension .value.right{border-color:#fecdd3;background:#fffafb}.dimension-label{display:flex;align-items:center;justify-content:center;margin:.35vh .5vw;border-radius:.4vw;background:#e8eef5;color:var(--primary);font-size:1.55vw;font-weight:900;text-align:center}.takeaway{margin-top:1.5vh;padding:1vh 1.2vw;border-radius:.55vw;background:var(--primary);color:#fff;font-size:1.8vw;line-height:1.35;font-weight:900;text-align:center}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="ppt-container"><div class="slide"><header class="page-header"><h1 class="page-title" data-title></h1></header><main class="content-area" data-template="two-object-comparison"><section class="comparison"><div class="object-heads"><div class="object left" data-object="left"><strong data-left-label></strong><span data-left-subtitle></span></div><div></div><div class="object right" data-object="right"><strong data-right-label></strong><span data-right-subtitle></span></div></div><div class="rows" data-dimensions></div><div class="takeaway" data-takeaway></div></section></main></div></div><script type="application/json" id="template-data">{"title":"同步调用与异步任务","left":{"label":"同步调用","subtitle":"请求等待结果"},"right":{"label":"异步任务","subtitle":"请求先返回任务标识"},"dimensions":[{"label":"响应方式","left":"连接保持到处理完成","right":"客户端随后查询或接收通知"},{"label":"适合时长","left":"短时间、结果立即使用","right":"长时间、允许延后获取"},{"label":"失败处理","left":"当前请求直接返回错误","right":"任务记录保存状态与重试次数"},{"label":"典型场景","left":"查询、校验、轻量计算","right":"导出、转码、批量分析"}],"takeaway":"处理时间不可预测或超过连接容忍时间时，异步任务更稳定。"}</script><script>(()=>{const data=JSON.parse(document.getElementById('template-data').textContent),root=document.querySelector('[data-template]'),put=(s,v)=>{const n=document.querySelector(s);if(n&&v!=null)n.textContent=v};put('[data-title]',data.title);put('[data-left-label]',data.left.label);put('[data-left-subtitle]',data.left.subtitle);put('[data-right-label]',data.right.label);put('[data-right-subtitle]',data.right.subtitle);put('[data-takeaway]',data.takeaway);(data.dimensions||[]).slice(0,6).forEach(item=>{const row=document.createElement('div');row.className='dimension';row.dataset.dimension='';row.innerHTML='<span class="value left"></span><strong class="dimension-label"></strong><span class="value right"></span>';row.querySelector('.value.left').textContent=item.left;row.querySelector('.dimension-label').textContent=item.label;row.querySelector('.value.right').textContent=item.right;root.querySelector('[data-dimensions]').appendChild(row)})})();</script></body></html>
