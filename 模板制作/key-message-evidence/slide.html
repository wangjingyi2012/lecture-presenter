<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>核心结论与支撑依据</title><style>
:root{--text:#0f172a;--muted:#64748b;--primary:#002855;--blue:#0369a1;--line:#cbd5e1;--soft:#f5f8fb;--warm:#fff7ed;--warm-line:#fed7aa}
*{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;background:#fff;color:var(--text);font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}.ppt-container,.slide{width:100%;height:100%}.slide{position:relative;border-top:.7vh solid var(--primary)}.page-header{position:absolute;top:4vh;left:6vw;right:6vw;padding-bottom:1.4vh;border-bottom:.35vh solid var(--primary)}.page-title{margin:0;font-size:2.8vw;line-height:1.15;font-weight:900}.content-area{position:absolute;top:14vh;bottom:10vh;left:6vw;right:6vw;font-size:1.8vw}.lead{margin:0!important;color:var(--muted);font-size:1.8vw;line-height:1.35}.message-layout{position:absolute;left:0;right:0;top:7vh;bottom:8vh;display:grid;grid-template-columns:34vw 1fr;gap:3vw;align-items:stretch}.message-panel{display:flex;flex-direction:column;justify-content:center;padding:3vh 2.2vw;border:.12vw solid #93c5fd;border-radius:.8vw;background:#eff6ff}.message-label{margin-bottom:2vh;color:var(--blue);font-size:1.5vw;font-weight:900}.message{font-size:2.35vw;line-height:1.45;font-weight:900}.evidence-list{display:flex;flex-direction:column;justify-content:center;gap:1.35vh}.evidence-item{display:grid;grid-template-columns:3.2vw 10vw 1fr;align-items:center;gap:1vw;min-height:11vh;padding:1.4vh 1.2vw;border-bottom:.12vw solid var(--line)}.evidence-item:last-child{border-bottom:0}.evidence-number{color:#94a3b8;font-size:2.1vw;font-weight:900}.evidence-label{color:var(--primary);font-size:1.8vw;line-height:1.25;font-weight:900}.evidence-detail{color:#334155;font-size:1.8vw;line-height:1.4}.takeaway{position:absolute;left:8vw;right:8vw;bottom:.3vh;min-height:5.4vh;padding:.8vh 1.2vw;border:.1vw solid var(--warm-line);border-radius:.6vw;background:var(--warm);color:#9a3412;font-size:1.8vw;line-height:1.35;font-weight:900;text-align:center;display:flex;align-items:center;justify-content:center}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="ppt-container"><div class="slide"><header class="page-header"><h1 class="page-title" data-title></h1></header><main class="content-area" data-template="key-message-evidence"><p class="lead" data-lead></p><div class="message-layout"><section class="message-panel"><div class="message-label">核心结论</div><div class="message" data-message></div></section><section class="evidence-list" data-evidence></section></div><div class="takeaway" data-takeaway></div></main></div></div><script type="application/json" id="template-data">{"title":"灰度发布降低上线风险","lead":"新版本先覆盖小范围真实流量，再根据运行结果逐步扩大范围。","message":"灰度发布把一次不可逆的大变更，拆成多次可观察、可回退的小变更。","evidence":[{"label":"影响范围","detail":"异常只影响首批灰度用户，不扩散到全部流量。"},{"label":"验证依据","detail":"错误率、延迟和业务转化直接决定是否继续放量。"},{"label":"恢复能力","detail":"保留旧版本和流量开关，指标异常时立即回退。"}],"takeaway":"放量速度服从验证结果，不服从预设时间表。"}</script><script>(()=>{const data=JSON.parse(document.getElementById('template-data').textContent),root=document.querySelector('[data-template]'),put=(s,v)=>{const n=document.querySelector(s);if(n&&v!=null)n.textContent=v};put('[data-title]',data.title);put('[data-lead]',data.lead);put('[data-message]',data.message);put('[data-takeaway]',data.takeaway);(data.evidence||[]).slice(0,4).forEach((item,index)=>{const row=document.createElement('div');row.className='evidence-item';row.dataset.evidenceItem='';row.innerHTML='<span class="evidence-number"></span><strong class="evidence-label"></strong><span class="evidence-detail"></span>';row.querySelector('.evidence-number').textContent=String(index+1).padStart(2,'0');row.querySelector('.evidence-label').textContent=item.label;row.querySelector('.evidence-detail').textContent=item.detail;root.querySelector('[data-evidence]').appendChild(row)})})();</script></body></html>
