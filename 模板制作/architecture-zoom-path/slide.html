<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>架构总览到局部路径</title><style>
:root{--text:#0f172a;--muted:#64748b;--primary:#002855;--input:#0369a1;--runtime:#1d4ed8;--data:#15803d;--control:#c2410c;--output:#166534;--line:#cbd5e1;--surface:#fff}
*{box-sizing:border-box}
body{margin:0;
width:100vw;
height:100vh;
background:#fff;
color:var(--text);
font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}
.ppt-container,.slide{width:100%;
height:100%}
.slide{position:relative;
border-top:.7vh solid var(--primary)}
.page-header{position:absolute;
top:4vh;
left:6vw;
right:6vw;
padding-bottom:1.4vh;
border-bottom:.35vh solid var(--primary)}
.page-title{margin:0;
font-size:2.8vw;
line-height:1.15;
font-weight:900}
.content-area{position:absolute;
top:14vh;
bottom:8vh;
left:6vw;
right:6vw;
font-size:1.8vw}
.lead{margin:0!important;
color:var(--muted);
font-size:1.65vw;
line-height:1.35}
.architecture-stage{position:relative;
width:100%;
height:69vh;
cursor:pointer;
user-select:none}
.architecture-canvas{position:absolute;
left:0;
right:0;
top:5.7vh;
bottom:12.2vh;
display:grid;
grid-template-columns:12vw 1fr 12vw;
align-items:center;
gap:1.4vw}
.endpoint{min-height:20vh;
padding:1.5vh 1vw;
border:.12vw solid #7dd3fc;
border-radius:.8vw;
background:#f0f9ff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
gap:.8vh;
transition:opacity .3s ease,transform .3s ease,box-shadow .3s ease}
.endpoint.output{border-color:#86efac;
background:#f0fdf4}
.endpoint strong{font-size:1.9vw;
line-height:1.2}
.endpoint span{color:var(--muted);
font-size:1.5vw;
line-height:1.35}
.system-shell{position:relative;
min-height:48vh;
padding:1.6vh 1.2vw;
border:.14vw dashed #94a3b8;
border-radius:1vw;
background:#f8fafc;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:1vw;
align-items:stretch}
.layer{min-width:0;
padding:1.1vh .8vw;
border:.1vw solid var(--line);
border-radius:.7vw;
background:#fff;
transition:opacity .3s ease,transform .3s ease,box-shadow .3s ease,border-color .3s ease}
.layer-title{margin:0 0 1vh!important;
color:var(--primary);
font-size:1.6vw;
line-height:1.2;
font-weight:900;
text-align:center}
.module-list{display:flex;
flex-direction:column;
gap:.8vh}
.module{min-height:7.4vh;
padding:.65vh .65vw;
border:.1vw solid #dbe3ec;
border-radius:.5vw;
background:#f8fafc;
color:#334155;
font-size:1.5vw;
line-height:1.25;
font-weight:800;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
transition:opacity .28s ease,transform .28s ease,background .28s ease,border-color .28s ease,box-shadow .28s ease}
.architecture-arrow{position:absolute;
top:50%;
width:3.2vw;
height:.28vh;
background:var(--line);
transform:translateY(-50%)}
.architecture-arrow::after{content:"";
position:absolute;
right:-.15vw;
top:50%;
width:.75vw;
height:.75vw;
border-top:.2vw solid var(--line);
border-right:.2vw solid var(--line);
transform:translateY(-50%) rotate(45deg)}
.arrow-in{left:12.3vw}
.arrow-out{right:12.3vw}
.focus-label{position:absolute;
left:50%;
top:.2vh;
z-index:5;
min-width:24vw;
padding:.55vh 1vw;
border:.1vw solid #bfdbfe;
border-radius:.6vw;
background:#fff;
color:var(--primary);
font-size:1.55vw;
font-weight:900;
text-align:center;
opacity:0;
transform:translate(-50%,-1vh);
transition:opacity .3s ease,transform .3s ease}
.path-strip{position:absolute;
left:50%;
bottom:6.4vh;
z-index:7;
width:78vw;
min-height:5.2vh;
padding:.6vh 1vw;
border:.1vw solid #bae6fd;
border-radius:.65vw;
background:#f0f9ff;
color:#075985;
font-size:1.5vw;
line-height:1.3;
font-weight:900;
text-align:center;
transform:translateX(-50%);
opacity:0;
transition:opacity .3s ease}
.takeaway{position:absolute;
left:50%;
bottom:6.4vh;
z-index:6;
width:75vw;
min-height:5.2vh;
padding:.6vh 1vw;
border:.1vw solid #bbf7d0;
border-radius:.65vw;
background:#f0fdf4;
color:#166534;
font-size:1.55vw;
line-height:1.3;
font-weight:900;
text-align:center;
transform:translateX(-50%);
opacity:0;
transition:opacity .3s ease}
.step-1 .focus-label,.step-2 .focus-label,.step-3 .focus-label{opacity:1;
transform:translate(-50%,0)}
.step-1 .layer:not([data-focus="core"]),.step-2 .layer:not([data-focus="support"]){opacity:.28;
transform:scale(.97)}
.step-1 .layer[data-focus="core"],.step-2 .layer[data-focus="support"]{border-color:#60a5fa;
box-shadow:0 .8vh 2vh rgba(29,78,216,.16);
transform:translateY(-.5vh)}
.step-3 .module:not(.path-active),.step-3 .layer{opacity:.3}
.step-3 .layer:has(.path-active){opacity:1;
border-color:#86efac}
.step-3 .module.path-active{opacity:1;
background:#ecfdf5;
border-color:var(--output);
color:#14532d;
box-shadow:0 .4vh 1vh rgba(22,101,52,.15);
transform:translateY(-.2vh)}
.step-3 .endpoint{opacity:1;
border-color:var(--output);
box-shadow:0 .5vh 1.2vh rgba(22,101,52,.12)}
.step-3 .path-strip{opacity:1}
.step-3 .takeaway{opacity:0}
.step-0 .takeaway,.step-1 .takeaway,.step-2 .takeaway{opacity:1}
.step-1 .takeaway,.step-2 .takeaway{color:var(--primary);
border-color:#bfdbfe;
background:#eff6ff}
.step-rail{position:absolute;
left:50%;
bottom:.15vh;
z-index:10;
display:flex;
align-items:center;
gap:.45vw;
transform:translateX(-50%)}
.step-node{min-width:10vw;
min-height:4vh;
padding:.45vh .75vw;
border:.1vw solid var(--line);
border-radius:.6vw;
background:#fff;
color:var(--muted);
font-family:inherit;
font-size:1.5vw;
font-weight:900;
line-height:1.15;
white-space:nowrap;
cursor:pointer;
transition:color .24s ease,background .24s ease,border-color .24s ease,transform .24s ease}
.step-node.active{background:var(--primary);
border-color:var(--primary);
color:#fff;
transform:translateY(-.3vh)}
.step-arrow{color:var(--muted);
font-size:1.8vw;
font-weight:900}
.progress{position:absolute;
right:.2vw;
bottom:.25vh;
display:flex;
gap:.45vw}
.progress span{width:.62vw;
height:.62vw;
border-radius:50%;
background:var(--line)}
.progress span.active{width:1.9vw;
border-radius:99vw;
background:var(--primary)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}
}

</style></head><body><div class="ppt-container"><div class="slide"><header class="page-header"><h1 class="page-title" data-title></h1></header><main class="content-area" data-template="architecture-zoom-path" data-step="0" data-max-step="3"><p class="lead" data-lead></p><div class="architecture-stage" id="architectureStage"><div class="focus-label" data-focus-label></div><div class="architecture-canvas"><section class="endpoint input"><strong data-input-label></strong><span data-input-detail></span></section><span class="architecture-arrow arrow-in"></span><div class="system-shell" data-layers></div><span class="architecture-arrow arrow-out"></span><section class="endpoint output"><strong data-output-label></strong><span data-output-detail></span></section></div><div class="takeaway" data-takeaway></div><div class="path-strip" data-path-strip></div><nav class="step-rail"><button class="step-node active" data-target="0">系统总览</button><span class="step-arrow">→</span><button class="step-node" data-target="1">聚焦核心层</button><span class="step-arrow">→</span><button class="step-node" data-target="2">聚焦支撑层</button><span class="step-arrow">→</span><button class="step-node" data-target="3">端到端路径</button></nav><div class="progress"><span class="active"></span><span></span><span></span><span></span></div></div></main></div></div><script type="application/json" id="template-data">{"title":"实时风控系统架构","lead":"一条交易从事件接入开始，经过规则与模型判断，最终输出风险处置结果。","input":{"label":"交易事件","detail":"金额、账户、设备"}
,"layers":[{"id":"access","role":"context","label":"接入层","modules":[{"id":"gateway","label":"事件网关"}
,{"id":"normalize","label":"字段标准化"}
]}
,{"id":"decision","role":"core","label":"决策层","modules":[{"id":"rules","label":"规则引擎"}
,{"id":"model","label":"风险模型"}
,{"id":"merge","label":"结果融合"}
]}
,{"id":"data","role":"support","label":"数据层","modules":[{"id":"profile","label":"用户画像"}
,{"id":"history","label":"历史行为"}
,{"id":"blacklist","label":"风险名单"}
]}
],"output":{"label":"处置结果","detail":"放行、复核、拦截"}
,"path":["gateway","normalize","model","merge"],"takeaway":"接入层统一事件，决策层完成判断，数据层为每次判断提供证据。"}
</script><script>(()=>{const data=JSON.parse(document.getElementById('template-data').textContent),root=document.querySelector('[data-template]'),stage=document.getElementById('architectureStage');
const put=(s,v,p=document)=>{const n=p.querySelector(s);
if(n&&v!=null)n.textContent=v}
;
put('[data-title]',data.title);
put('[data-lead]',data.lead);
put('[data-input-label]',data.input.label);
put('[data-input-detail]',data.input.detail);
put('[data-output-label]',data.output.label);
put('[data-output-detail]',data.output.detail);
put('[data-takeaway]',data.takeaway);
const layers=root.querySelector('[data-layers]'),moduleMap=new Map;(data.layers||[]).slice(0,4).forEach(layer=>{const section=document.createElement('section');
section.className='layer';
section.dataset.layer='';
section.dataset.focus=layer.role||'context';
const title=document.createElement('h2');
title.className='layer-title';
title.textContent=layer.label;
const list=document.createElement('div');
list.className='module-list';(layer.modules||[]).slice(0,4).forEach(item=>{const module=document.createElement('div');
module.className='module';
module.dataset.module=item.id;
module.textContent=item.label;
list.appendChild(module);
moduleMap.set(item.id,{node:module,label:item.label}
)}
);
section.append(title,list);
layers.appendChild(section)}
);
const path=(data.path||[]).filter(id=>moduleMap.has(id));
path.forEach(id=>{moduleMap.get(id).node.classList.add('path-active');
moduleMap.get(id).node.dataset.pathNode='' }
);
put('[data-path-strip]',`${data.input.label}
 → ${path.map(id=>moduleMap.get(id).label).join(' → ')}
 → ${data.output.label}
`);
const nodes=[...root.querySelectorAll('[data-target]')],dots=[...root.querySelectorAll('.progress span')],labels=['系统边界与全部模块','聚焦主要判断层','聚焦数据与证据层','高亮端到端处理路径'];
let current=0;
function render(next){current=Math.max(0,Math.min(3,next));
stage.className=`architecture-stage step-${current}
`;
root.dataset.step=String(current);
put('[data-focus-label]',labels[current],root);
nodes.forEach(n=>n.classList.toggle('active',Number(n.dataset.target)===current));
dots.forEach((d,i)=>d.classList.toggle('active',i===current))}
stage.addEventListener('click',e=>{if(e.target.closest('button'))return;
if(current<3)render(current+1)}
);
nodes.forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();
render(Number(n.dataset.target))}
));
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)&&current<3){e.preventDefault();
render(current+1)}
else if(['ArrowLeft','PageUp'].includes(e.key)&&current>0){e.preventDefault();
render(current-1)}
}
);
render(0)}
)();</script></body></html>
