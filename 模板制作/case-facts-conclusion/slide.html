<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>案例事实与分析结论</title><style>
:root{--text:#0f172a;--muted:#64748b;--primary:#002855;--blue:#0369a1;--red:#b91c1c;--line:#dbe3ec;--surface:#f8fafc}
*{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;background:#fff;color:var(--text);font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}.ppt-container,.slide{width:100%;height:100%}.slide{position:relative;border-top:.7vh solid var(--primary)}.page-header{position:absolute;top:4vh;left:6vw;right:6vw;padding-bottom:1.4vh;border-bottom:.35vh solid var(--primary)}.page-title{margin:0;font-size:2.8vw;line-height:1.15;font-weight:900}.content-area{position:absolute;top:14vh;bottom:10vh;left:6vw;right:6vw;font-size:1.8vw}.lead{margin:0!important;color:#334155;font-size:1.8vw;line-height:1.4;font-weight:800}.case-layout{position:absolute;left:0;right:0;top:8vh;bottom:8vh;display:grid;grid-template-columns:47vw 1fr;gap:2.5vw}.facts{display:flex;flex-direction:column;justify-content:center}.facts-title,.analysis-kicker{margin-bottom:1.1vh;color:var(--muted);font-size:1.5vw;font-weight:900}.fact{display:grid;grid-template-columns:7.5vw 1fr;align-items:center;min-height:9.2vh;border-bottom:.1vw solid var(--line)}.fact strong{color:var(--blue);font-size:1.8vw}.fact span{color:#334155;font-size:1.8vw;line-height:1.35}.analysis-panel{align-self:center;padding:3vh 2vw;border:.12vw solid #fecaca;border-radius:.75vw;background:#fff7f7}.analysis-title{margin:0 0 1.7vh!important;color:var(--red);font-size:2.05vw;line-height:1.25}.analysis{color:#334155;font-size:1.8vw;line-height:1.55}.lesson{position:absolute;left:5vw;right:5vw;bottom:.2vh;padding:1vh 1.2vw;border-radius:.55vw;background:var(--primary);color:#fff;font-size:1.8vw;line-height:1.35;font-weight:900;text-align:center}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="ppt-container"><div class="slide"><header class="page-header"><h1 class="page-title" data-title></h1></header><main class="content-area" data-template="case-facts-conclusion"><p class="lead" data-lead></p><div class="case-layout"><section class="facts"><div class="facts-title">案例事实</div><div data-facts></div></section><section class="analysis-panel"><div class="analysis-kicker">原因分析</div><h2 class="analysis-title" data-analysis-title></h2><div class="analysis" data-analysis></div></section></div><div class="lesson" data-lesson></div></main></div></div><script type="application/json" id="template-data">{"title":"一次缓存穿透事故","lead":"促销开始后，大量不存在的商品编号绕过缓存，持续访问数据库。","facts":[{"label":"触发","value":"外部流量批量请求随机商品编号"},{"label":"现象","value":"缓存命中率从 92% 降至 18%"},{"label":"影响","value":"数据库连接池耗尽，商品页大面积超时"},{"label":"恢复","value":"增加空值缓存并限制异常编号请求频率"}],"analysisTitle":"事故并非缓存容量不足","analysis":"系统只缓存存在的商品，不存在的编号每次都会访问数据库。攻击流量利用了这一语义缺口，使缓存层失去拦截作用。","lesson":"缓存策略必须同时定义命中、未命中和异常输入的处理方式。"}</script><script>(()=>{const data=JSON.parse(document.getElementById('template-data').textContent),root=document.querySelector('[data-template]'),put=(s,v)=>{const n=document.querySelector(s);if(n&&v!=null)n.textContent=v};put('[data-title]',data.title);put('[data-lead]',data.lead);put('[data-analysis-title]',data.analysisTitle);put('[data-analysis]',data.analysis);put('[data-lesson]',data.lesson);(data.facts||[]).slice(0,5).forEach(item=>{const row=document.createElement('div');row.className='fact';row.dataset.fact='';row.innerHTML='<strong></strong><span></span>';row.querySelector('strong').textContent=item.label;row.querySelector('span').textContent=item.value;root.querySelector('[data-facts]').appendChild(row)})})();</script></body></html>
