<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>参数控制与结果空间</title><style>
:root{--text:#0f172a;--muted:#64748b;--primary:#002855;--selected:#dc2626;--caution:#c2410c;--line:#cbd5e1;--surface:#fff;--space:#f8fafc}
*{box-sizing:border-box}
body{margin:0;
width:100vw;
height:100vh;
background:#fff;
color:var(--text);
font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}
.ppt-container,.slide{width:100%;
height:100%}
.slide{position:relative;
border-top:.7vh solid var(--primary)}
.page-header{position:absolute;
top:4vh;
left:6vw;
right:6vw;
padding-bottom:1.4vh;
border-bottom:.35vh solid var(--primary)}
.page-title{margin:0;
font-size:2.8vw;
line-height:1.15;
font-weight:900}
.content-area{position:absolute;
top:14vh;
bottom:8vh;
left:6vw;
right:6vw;
font-size:1.8vw}
.lead{margin:0!important;
color:var(--muted);
font-size:1.65vw;
line-height:1.35}
.parameter-stage{position:relative;
width:100%;
height:69vh}
.parameter-layout{position:absolute;
left:0;
right:0;
top:5.5vh;
bottom:14vh;
display:grid;
grid-template-columns:17vw 1fr 21.5vw;
gap:1.2vw;
align-items:stretch}
.control-panel,.result-panel{padding:1.5vh 1.1vw;
border:.1vw solid var(--line);
border-radius:.8vw;
background:#fff;
box-shadow:0 .45vh 1.2vh rgba(15,23,42,.06)}
.panel-title{margin:0 0 1.2vh!important;
color:var(--primary);
font-size:1.7vw;
line-height:1.2;
font-weight:900}
.control{padding:1.2vh .7vw;
border:.1vw solid #dbe3ec;
border-radius:.6vw;
background:#f8fafc}
.control-head{display:flex;
align-items:baseline;
justify-content:space-between;
gap:.5vw}
.control-label{font-size:1.55vw;
font-weight:900}
.control-value{color:var(--selected);
font-size:2.1vw;
font-weight:900}
.control input{width:100%;
margin:1.5vh 0 .8vh;
accent-color:var(--selected)}
.control-range{display:flex;
justify-content:space-between;
color:var(--muted);
font-size:1.5vw}
.control-note{margin-top:1.5vh;
color:var(--muted);
font-size:1.5vw;
line-height:1.4}
.space-panel{position:relative;
border:.1vw solid var(--line);
border-radius:.8vw;
background:var(--space);
box-shadow:inset 0 0 0 .12vw rgba(148,163,184,.12)}
.space-title{position:absolute;
left:1vw;
top:1vh;
color:var(--primary);
font-size:1.55vw;
font-weight:900}
.axis-x,.axis-y{position:absolute;
background:#94a3b8}
.axis-x{left:7%;
right:5%;
bottom:10%;
height:.12vw}
.axis-y{left:7%;
top:10%;
bottom:10%;
width:.12vw}
.axis-label{position:absolute;
color:var(--muted);
font-size:1.5vw;
font-weight:800}
.label-x{right:4%;
bottom:4%}
.label-y{left:.55%;
top:14%;
writing-mode:vertical-rl}
.point{position:absolute;
width:2.45vw;
height:2.45vw;
border-radius:50%;
border:.12vw solid #94a3b8;
background:#fff;
color:#475569;
font-size:1.5vw;
font-weight:900;
display:flex;
align-items:center;
justify-content:center;
transform:translate(-50%,50%);
transition:background .28s ease,border-color .28s ease,color .28s ease,transform .28s ease,box-shadow .28s ease}
.point.selected{background:var(--selected);
border-color:var(--selected);
color:#fff;
transform:translate(-50%,50%) scale(1.12);
box-shadow:0 0 0 .35vw rgba(220,38,38,.14)}
[data-points]{position:absolute;
inset:0;
z-index:2;
pointer-events:none}
.threshold-band{position:absolute;
left:7%;
right:5%;
top:10%;
height:0;
background:rgba(220,38,38,.08);
border-bottom:.12vw dashed rgba(220,38,38,.6);
z-index:1;
pointer-events:none;
transition:height .3s ease}
.threshold-label{position:absolute;
right:5%;
padding:.25vh .45vw;
border-radius:.35vw;
background:#fff1f2;
color:#b91c1c;
font-size:1.5vw;
font-weight:900;
z-index:3;
transform:translateY(-50%);
transition:top .3s ease}
.result-list{display:flex;
flex-direction:column;
gap:.75vh;
min-height:0}
.result-item{min-height:5.6vh;
padding:.45vh .55vw;
border:.1vw solid #fecaca;
border-radius:.5vw;
background:#fff7f7;
display:grid;
grid-template-columns:2.5vw 1fr 3.2vw;
align-items:center;
gap:.45vw}
.rank{width:2.2vw;
height:2.2vw;
border-radius:50%;
background:var(--selected);
color:#fff;
font-size:1.5vw;
font-weight:900;
display:flex;
align-items:center;
justify-content:center}
.result-copy strong{display:block;
font-size:1.5vw;
line-height:1.2}
.result-copy span{display:block;
margin-top:.15vh;
color:var(--muted);
font-size:1.5vw;
line-height:1.2}
.result-score{color:var(--selected);
font-size:1.55vw;
font-weight:900;
text-align:right}
.empty-result{min-height:20vh;
display:flex;
align-items:center;
justify-content:center;
color:var(--muted);
font-size:1.5vw;
text-align:center}
.takeaway{position:absolute;
left:50%;
bottom:.8vh;
width:75vw;
min-height:5.4vh;
padding:.7vh 1.1vw;
border:.1vw solid #fed7aa;
border-radius:.65vw;
background:#fff7ed;
color:#9a3412;
font-size:1.55vw;
line-height:1.3;
font-weight:900;
text-align:center;
transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}
}

</style></head><body><div class="ppt-container"><div class="slide"><header class="page-header"><h1 class="page-title" data-title></h1></header><main class="content-area" data-template="parameter-result-space"><p class="lead" data-lead></p><div class="parameter-stage"><div class="parameter-layout"><section class="control-panel"><h2 class="panel-title">参数控制</h2><div data-controls></div><p class="control-note">拖动参数后，图中选中范围与右侧结果同步变化。</p></section><section class="space-panel"><div class="space-title">样本空间</div><span class="axis-x"></span><span class="axis-y"></span><span class="axis-label label-x">行为偏离度</span><span class="axis-label label-y">风险特征强度</span><div class="threshold-band" data-threshold-band></div><div class="threshold-label" data-threshold-label></div><div data-points></div></section><section class="result-panel"><h2 class="panel-title">筛选结果 <span data-result-count></span></h2><div class="result-list" data-result-list></div></section></div><div class="takeaway" data-takeaway></div></div></main></div></div><script type="application/json" id="template-data">{"title":"异常样本筛选","lead":"阈值越低，系统返回的可疑样本越多，误报也会同步增加。","controls":[{"id":"threshold","label":"异常阈值","min":40,"max":90,"step":5,"value":70,"unit":"分"}
],"points":[{"id":"A01","label":"登录地点突变","x":18,"y":78,"score":92}
,{"id":"A02","label":"短时高频请求","x":34,"y":62,"score":86}
,{"id":"A03","label":"设备指纹变化","x":51,"y":72,"score":81}
,{"id":"A04","label":"常规查询","x":27,"y":28,"score":43}
,{"id":"A05","label":"夜间批量导出","x":72,"y":81,"score":88}
,{"id":"A06","label":"密码修改","x":63,"y":48,"score":66}
,{"id":"A07","label":"新设备登录","x":82,"y":65,"score":74}
,{"id":"A08","label":"资料浏览","x":46,"y":34,"score":38}
],"resultLimit":5,"takeaway":"阈值决定召回范围：降低阈值会扩大覆盖，同时带来更多误报。"}
</script><script>(()=>{const data=JSON.parse(document.getElementById('template-data').textContent),root=document.querySelector('[data-template]');
const put=(s,v,p=document)=>{const n=p.querySelector(s);
if(n&&v!=null)n.textContent=v}
;
put('[data-title]',data.title);
put('[data-lead]',data.lead);
put('[data-takeaway]',data.takeaway);
const points=(data.points||[]).slice(0,12),pointNodes=new Map,pointWrap=root.querySelector('[data-points]');
points.forEach(item=>{const p=document.createElement('div');
p.className='point';
p.dataset.point=item.id;
p.style.left=(7+item.x*.88)+'%';
p.style.bottom=(10+item.y*.8)+'%';
p.textContent=item.id.replace(/\D/g,'')||item.id.slice(0,2);
p.title=`${item.label}
 · ${item.score}
`;
pointWrap.appendChild(p);
pointNodes.set(item.id,p)}
);
const controls=(data.controls||[]).slice(0,2),controlWrap=root.querySelector('[data-controls]');
let threshold=controls[0]?controls[0].value:70;
controls.forEach(control=>{const box=document.createElement('div');
box.className='control';
box.dataset.control=control.id;
const head=document.createElement('div');
head.className='control-head';
const label=document.createElement('span');
label.className='control-label';
label.textContent=control.label;
const value=document.createElement('span');
value.className='control-value';
value.textContent=`${control.value}
${control.unit||''}
`;
const input=document.createElement('input');
input.type='range';
input.min=control.min;
input.max=control.max;
input.step=control.step||1;
input.value=control.value;
const range=document.createElement('div');
range.className='control-range';
range.innerHTML=`<span>${control.min}
${control.unit||''}
</span><span>${control.max}
${control.unit||''}
</span>`;
head.append(label,value);
box.append(head,input,range);
controlWrap.appendChild(box);
input.addEventListener('input',()=>{threshold=Number(input.value);
value.textContent=`${threshold}
${control.unit||''}
`;
render()}
)}
);
function render(){const matched=points.filter(item=>item.score>=threshold).sort((a,b)=>b.score-a.score),selected=matched.slice(0,data.resultLimit||5);
const ids=new Set(matched.map(x=>x.id));
pointNodes.forEach((node,id)=>node.classList.toggle('selected',ids.has(id)));
const band=root.querySelector('[data-threshold-band]'),thresholdLabel=root.querySelector('[data-threshold-label]'),ratio=(threshold-40)/50;
band.style.height=Math.max(5,80-ratio*70)+'%';
thresholdLabel.style.top=(10+ratio*70)+'%';
thresholdLabel.textContent=`阈值 ${threshold}
`;
const countLabel=matched.length>selected.length?`${matched.length} 项 / 前 ${selected.length}`:`${matched.length} 项`;
put('[data-result-count]',countLabel,root);
const list=root.querySelector('[data-result-list]');
list.textContent='';
if(!selected.length){const empty=document.createElement('div');
empty.className='empty-result';
empty.textContent='当前阈值下没有符合条件的样本';
list.appendChild(empty)}
selected.forEach((item,index)=>{const row=document.createElement('div');
row.className='result-item';
row.innerHTML='<span class="rank"></span><div class="result-copy"><strong></strong><span></span></div><span class="result-score"></span>';
row.querySelector('.rank').textContent=String(index+1);
row.querySelector('strong').textContent=item.label;
row.querySelector('.result-copy span').textContent=item.id;
row.querySelector('.result-score').textContent=String(item.score);
list.appendChild(row)}
)}
render()}
)();</script></body></html>
