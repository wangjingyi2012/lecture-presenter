<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>循环调度流程图</title>
  <style>
    :root { --text:#f1f5f9; --muted:#94a3b8; --primary:#1f2937; --tool:#1d4ed8; --result:#15803d; --final:#7c3aed; --line:#94a3b8; --surface:#fff; }
    * { box-sizing:border-box; } body { margin:0; width:100vw; height:100vh; background:#fff; color:#1e293b; font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif; }
    .ppt-container,.slide { width:100%; height:100%; } .slide { position:relative; background:var(--surface); border-top:.7vh solid var(--primary); }
    .page-header { position:absolute; top:4vh; left:6vw; right:6vw; padding-bottom:1.4vh; border-bottom:.35vh solid var(--primary); } .page-title { margin:0; font-size:2.5vw; line-height:1.15; font-weight:900; }
    .content-area { position:absolute; top:14vh; bottom:8vh; left:6vw; right:6vw; display:grid; grid-template-rows:auto 1fr auto; gap:1.4vh; }
    .lead-statement { margin:0; padding:1.3vh 2vw; text-align:center; border:1px solid #cbd5e1; border-radius:8px; background:#f8fafc; font-size:1.75vw; line-height:1.35; font-weight:600; }
    .flow-chart { position:relative; display:flex; flex-direction:column; max-width:80vw; width:100%; margin:0 auto; gap:.3vh; }
    .row { display:grid; grid-template-columns:14% 3% 1fr 3% 24%; align-items:center; gap:.4vw; } .row-final { grid-template-columns:14% 3% 1fr; }
    .node { padding:1.35vh 1.2vw; border-radius:6px; text-align:center; font-size:1.7vw; font-weight:700; line-height:1.3; color:var(--text); background:var(--primary); opacity:0; transform:translateX(-.6vw); transition:opacity .32s ease,transform .32s ease,background .32s ease,box-shadow .32s ease; }
    .node.tool { background:var(--tool); } .node.result { background:var(--result); } .node.final { background:var(--final); } .node.is-visible { opacity:1; transform:translateX(0); }
    .arrow { color:var(--muted); font-size:1.8vw; text-align:center; font-weight:700; opacity:0; transition:opacity .25s ease; } .arrow.is-visible { opacity:1; }
    .connector { width:100%; height:3.2vh; opacity:0; transition:opacity .3s ease; } .connector.is-visible { opacity:1; }
    .return-path { fill:none; stroke:var(--line); stroke-width:2; vector-effect:non-scaling-stroke; marker-end:url(#flow-arrow); }
    .caption { min-height:4vh; padding:.5vh; text-align:center; font-size:1.7vw; line-height:1.5; font-weight:600; } .caption-text { display:none; } .caption-text.active { display:inline; } .caption b { color:var(--result); }
    .flow-definitions { position:absolute; width:0; height:0; } @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  </style>
</head>
<body><div class="ppt-container"><div class="slide"><header class="page-header"><h1 class="page-title" data-slot="title">智能体工具调用循环</h1></header><main class="content-area" data-template="flow-loop-orchestration" data-step="0" data-max-step="16"><div class="lead-statement" data-slot="lead">每个工具结果都会回到决策中心，决定下一步动作。</div><div class="flow-chart"><svg class="flow-definitions" aria-hidden="true"><defs><marker id="flow-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 6,0 12" fill="var(--line)"/></marker></defs></svg><div data-flow-rows></div></div><div class="caption"><span class="caption-text" data-caption="thinking"></span><span class="caption-text" data-caption="receiving"></span></div></main></div></div>
  <script type="application/json" id="template-data">{"title":"智能体工具调用循环","lead":"每个工具结果都会回到决策中心，决定下一步动作。","cycles":[{"think":"分析当前状态","action":"读取目录","result":"获得文件列表"},{"think":"定位目标资源","action":"读取元数据","result":"获得资源信息"},{"think":"执行处理动作","action":"转换资源","result":"获得处理结果"},{"think":"确认交付状态","action":"发布结果","result":"获得发布回执"}],"final":"生成最终答复","captions":{"thinking":"每一轮都先判断下一步动作","receiving":"每一轮都接收工具返回的数据"}}</script>
  <script>
    (() => { const data=JSON.parse(document.getElementById('template-data').textContent); const root=document.querySelector('[data-template="flow-loop-orchestration"]'); const setText=(sel,val)=>{const n=root.querySelector(sel);if(n&&val!=null)n.textContent=val;}; setText('[data-slot="title"]',data.title);setText('[data-slot="lead"]',data.lead); const rows=root.querySelector('[data-flow-rows]'); const cycles=Array.isArray(data.cycles)?data.cycles.slice(0,4):[]; cycles.forEach((cycle,index)=>{ const base=index*3+1; const row=document.createElement('div');row.className='row'; const think=document.createElement('div');think.className='node';think.dataset.reveal=base;think.textContent=cycle.think||''; const a1=document.createElement('div');a1.className='arrow';a1.dataset.reveal=base+1;a1.textContent='→'; const action=document.createElement('div');action.className='node tool';action.dataset.reveal=base+1;action.textContent=cycle.action||''; const a2=document.createElement('div');a2.className='arrow';a2.dataset.reveal=base+2;a2.textContent='→'; const result=document.createElement('div');result.className='node result';result.dataset.reveal=base+2;result.textContent=cycle.result||''; row.append(think,a1,action,a2,result); rows.appendChild(row); if(index<cycles.length-1){const connector=document.createElementNS('http://www.w3.org/2000/svg','svg');connector.classList.add('connector');connector.dataset.reveal=base+3;connector.setAttribute('viewBox','0 0 800 64');connector.setAttribute('preserveAspectRatio','none');connector.setAttribute('aria-hidden','true');connector.innerHTML='<path class="return-path" d="M704 0 V24 H56 V56"/>'; rows.appendChild(connector);} }); const finalBase=Math.max(1,cycles.length*3+1); const finalRow=document.createElement('div');finalRow.className='row row-final';const finalThink=document.createElement('div');finalThink.className='node';finalThink.dataset.reveal=finalBase;finalThink.textContent='完成判断';const finalArrow=document.createElement('div');finalArrow.className='arrow';finalArrow.dataset.reveal=finalBase+1;finalArrow.textContent='→';const finalNode=document.createElement('div');finalNode.className='node final';finalNode.dataset.reveal=finalBase+1;finalNode.dataset.finalNode='';finalNode.textContent=data.final||'';finalRow.append(finalThink,finalArrow,finalNode);rows.appendChild(finalRow); root.dataset.maxStep=String(finalBase+3); const captions=data.captions||{}; root.querySelector('[data-caption="thinking"]').textContent=captions.thinking||'';root.querySelector('[data-caption="receiving"]').textContent=captions.receiving||''; let step=0; const maxStep=Number(root.dataset.maxStep); function render(n){step=Math.max(0,Math.min(maxStep,n));root.dataset.step=String(step);root.querySelectorAll('[data-reveal]').forEach(el=>el.classList.toggle('is-visible',Number(el.dataset.reveal)<=step));root.querySelector('[data-caption="thinking"]').classList.toggle('active',step===maxStep-1);root.querySelector('[data-caption="receiving"]').classList.toggle('active',step===maxStep);} function advance(){if(step<maxStep)render(step+1);} root.closest('.slide').addEventListener('click',advance);document.addEventListener('keydown',event=>{if(['ArrowRight','PageDown',' '].includes(event.key)&&step<maxStep){event.preventDefault();advance();}else if(['ArrowLeft','PageUp'].includes(event.key)&&step>0){event.preventDefault();render(step-1);}});render(0); })();
  </script>
</body></html>
