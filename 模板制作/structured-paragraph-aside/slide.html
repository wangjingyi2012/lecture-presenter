<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>结构化段落与侧栏摘要</title><style>
:root{--text:#0f172a;--muted:#64748b;--primary:#002855;--blue:#0369a1;--line:#cbd5e1;--surface:#f8fafc;--warm:#fff7ed}
*{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;background:#fff;color:var(--text);font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}.ppt-container,.slide{width:100%;height:100%}.slide{position:relative;border-top:.7vh solid var(--primary)}.page-header{position:absolute;top:4vh;left:6vw;right:6vw;padding-bottom:1.4vh;border-bottom:.35vh solid var(--primary)}.page-title{margin:0;font-size:2.8vw;line-height:1.15;font-weight:900}.content-area{position:absolute;top:14vh;bottom:10vh;left:6vw;right:6vw;font-size:1.8vw}.lead{margin:0!important;color:var(--muted);font-size:1.8vw;line-height:1.35}.paragraph-layout{position:absolute;left:0;right:0;top:7vh;bottom:8vh;display:grid;grid-template-columns:57vw 1fr;gap:3.5vw}.sections{display:flex;flex-direction:column;justify-content:center;gap:2.2vh}.section{display:grid;grid-template-columns:3.4vw 1fr;gap:1vw;padding-bottom:2vh;border-bottom:.1vw solid var(--line)}.section:last-child{border-bottom:0}.section-number{color:#94a3b8;font-size:2.1vw;font-weight:900}.section h2{margin:0 0 .7vh!important;color:var(--primary);font-size:1.95vw;line-height:1.2}.section p{margin:0!important;color:#334155;font-size:1.8vw;line-height:1.48}.summary-panel{align-self:center;padding:2.2vh 1.5vw;border:.12vw solid #bfdbfe;border-radius:.7vw;background:#eff6ff}.summary-title{margin-bottom:1.4vh;color:var(--primary);font-size:1.85vw;font-weight:900}.summary-item{padding:1.15vh 0;border-bottom:.1vw solid #cbd5e1}.summary-item:last-child{border-bottom:0}.summary-item strong{display:block;color:var(--blue);font-size:1.6vw}.summary-item span{display:block;margin-top:.4vh;color:#334155;font-size:1.7vw;line-height:1.35}.takeaway{position:absolute;left:5vw;right:5vw;bottom:.2vh;padding:.9vh 1.2vw;border-radius:.55vw;background:var(--warm);color:#9a3412;font-size:1.8vw;line-height:1.35;font-weight:900;text-align:center}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="ppt-container"><div class="slide"><header class="page-header"><h1 class="page-title" data-title></h1></header><main class="content-area" data-template="structured-paragraph-aside"><p class="lead" data-lead></p><div class="paragraph-layout"><section class="sections" data-sections></section><aside class="summary-panel"><div class="summary-title">内容摘要</div><div data-summary></div></aside></div><div class="takeaway" data-takeaway></div></main></div></div><script type="application/json" id="template-data">{"title":"变更记录是故障恢复的起点","lead":"系统异常发生后，恢复效率取决于团队能否快速还原近期变化。","sections":[{"heading":"先建立时间范围","body":"从告警首次出现的时间向前回溯，列出发布、配置、依赖和数据变更。时间范围越准确，排查对象越少。"},{"heading":"再验证影响关系","body":"变更时间接近故障时间，只能说明相关，不能证明因果。需要通过回滚、对照实例或指标变化验证影响。"},{"heading":"最后保留恢复证据","body":"记录执行人、变更内容、验证结果和恢复动作。下一次故障可以直接复用已有判断，而不是重新猜测。"}],"summary":[{"label":"查什么","value":"发布、配置、依赖、数据"},{"label":"怎么证实","value":"回滚、对照、指标"},{"label":"留下什么","value":"时间、动作、结果"}],"takeaway":"变更记录不是审计负担，而是缩短恢复时间的工程资产。"}</script><script>(()=>{const data=JSON.parse(document.getElementById('template-data').textContent),root=document.querySelector('[data-template]'),put=(s,v)=>{const n=document.querySelector(s);if(n&&v!=null)n.textContent=v};put('[data-title]',data.title);put('[data-lead]',data.lead);put('[data-takeaway]',data.takeaway);(data.sections||[]).slice(0,3).forEach((item,index)=>{const section=document.createElement('article');section.className='section';section.dataset.section='';section.innerHTML='<span class="section-number"></span><div><h2></h2><p></p></div>';section.querySelector('.section-number').textContent=String(index+1).padStart(2,'0');section.querySelector('h2').textContent=item.heading;section.querySelector('p').textContent=item.body;root.querySelector('[data-sections]').appendChild(section)});(data.summary||[]).slice(0,4).forEach(item=>{const node=document.createElement('div');node.className='summary-item';node.dataset.summaryItem='';node.innerHTML='<strong></strong><span></span>';node.querySelector('strong').textContent=item.label;node.querySelector('span').textContent=item.value;root.querySelector('[data-summary]').appendChild(node)})})();</script></body></html>
