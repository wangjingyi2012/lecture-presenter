<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片资产处理流水线</title>
  <style>
    :root { --text:#0f172a; --muted:#64748b; --primary:#002855; --selected:#16a34a; --processed:#c2410c; --success:#166534; --line:#cbd5e1; --surface:#fff; --result:#ecfdf5; }
    * { box-sizing:border-box; }
    body { margin:0; width:100vw; height:100vh; background:#fff; color:var(--text); font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif; }
    .ppt-container, .slide { width:100%; height:100%; }
    .slide { position:relative; border-top:.7vh solid var(--primary); cursor:pointer; }
    .page-header { position:absolute; top:4vh; left:6vw; right:6vw; padding-bottom:1.4vh; border-bottom:.35vh solid var(--primary); }
    .page-title { margin:0; font-size:2.8vw; line-height:1.15; font-weight:900; }
    .content-area { position:absolute; top:14vh; bottom:8vh; left:6vw; right:6vw; font-size:1.8vw; }
    .lead { margin:0 0 1vh; color:var(--muted); font-size:1.65vw; line-height:1.35; }
    .workflow-stage { position:relative; width:100%; height:69vh; user-select:none; }
    .pool-phase, .delivery-phase { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transition:opacity .42s ease, transform .42s ease, visibility .42s ease; }
    .pool-phase { flex-direction:column; gap:1.4vh; }
    .pool-label { align-self:flex-start; margin-left:2vw; color:var(--primary); font-size:1.7vw; font-weight:900; }
    .image-pool { display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(2,1fr); gap:.7vw; width:88vw; height:47vh; }
    .image-cell { position:relative; min-width:0; min-height:0; padding:.35vh .3vw; border:.1vw solid #e2e8f0; border-radius:.45vw; background:#fff; box-shadow:0 .25vh .8vh rgba(15,23,42,.05); transition:opacity .42s ease, filter .42s ease, border-color .42s ease, box-shadow .42s ease, transform .42s ease; }
    .image-cell img { display:block; width:100%; height:100%; object-fit:contain; border-radius:.3vw; background:#f8fafc; }
    .image-cell.zoomable, .zoomable { cursor:zoom-in; }
    .image-cell .group-label { position:absolute; left:.35vw; bottom:.45vh; padding:.18vh .35vw; border-radius:.25vw; background:rgba(255,255,255,.92); color:var(--muted); font-size:1.5vw; line-height:1.2; font-weight:800; }
    .image-cell .process-tag { position:absolute; top:.45vh; right:.35vw; padding:.18vh .4vw; border-radius:.25vw; background:var(--processed); color:#fff; font-size:1.5vw; line-height:1.2; font-weight:900; opacity:0; transition:opacity .3s ease; }
    .image-cell .check-tag { position:absolute; top:.45vh; right:.35vw; width:1.8vw; height:1.8vw; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--success); color:#fff; font-size:1.5vw; font-weight:900; opacity:0; transition:opacity .3s ease; }
    .filter-banner, .transform-banner { position:absolute; top:0; min-height:5.8vh; padding:.7vh 1.1vw; border-radius:.7vw; background:#fff; font-size:1.55vw; font-weight:900; opacity:0; transform:translateY(-1vh); transition:opacity .32s ease, transform .32s ease; }
    .filter-banner { left:2vw; border:.1vw solid rgba(22,163,74,.45); color:var(--selected); }
    .transform-banner { right:2vw; border:.1vw solid rgba(194,65,12,.42); color:var(--processed); }
    .step-1 .filter-banner, .step-2 .filter-banner, .step-3 .filter-banner, .step-4 .filter-banner, .step-2 .transform-banner, .step-3 .transform-banner, .step-4 .transform-banner { opacity:1; transform:translateY(0); }
    .step-1 .image-cell:not(.target), .step-2 .image-cell:not(.target), .step-3 .image-cell:not(.target), .step-4 .image-cell:not(.target) { opacity:.2; filter:grayscale(.85); }
    .step-1 .image-cell.target, .step-2 .image-cell.target { border-color:var(--selected); box-shadow:0 0 0 .16vw rgba(22,163,74,.2); }
    .step-2 .image-cell.target { transform:translateY(-.45vh); }
    .step-2 .image-cell.target .process-tag, .step-3 .image-cell.target .process-tag, .step-4 .image-cell.target .process-tag { opacity:1; }
    .step-3 .pool-phase .image-cell.target, .step-4 .pool-phase .image-cell.target { opacity:0; transform:scale(.8); pointer-events:none; }
    .delivery-phase { opacity:0; visibility:hidden; transform:translateX(4vw); gap:1.4vw; padding-bottom:5vh; }
    .step-3 .pool-phase, .step-4 .pool-phase { opacity:0; visibility:hidden; transform:translateX(-4vw); }
    .step-3 .delivery-phase, .step-4 .delivery-phase { opacity:1; visibility:visible; transform:translateX(0); }
    .selected-frame { width:47vw; min-height:43vh; padding:1.3vh 1vw; border:.14vw dashed var(--selected); border-radius:1vw; background:rgba(22,163,74,.05); }
    .selected-heading { margin:0 0 .8vh; color:var(--selected); font-size:1.65vw; font-weight:900; text-align:center; }
    .selected-grid { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:.65vw; height:37vh; }
    .selected-grid .image-cell { border-color:rgba(22,163,74,.7); box-shadow:0 .25vh .8vh rgba(22,163,74,.1); }
    .selected-grid .image-cell img { object-fit:contain; }
    .delivery-arrow { width:4vw; height:4vw; color:var(--primary); flex:0 0 auto; transition:color .3s ease, transform .3s ease; }
    .delivery-arrow svg { width:100%; height:100%; display:block; }
    .step-4 .delivery-arrow { color:var(--success); transform:translateX(.35vw); }
    .destination-card { width:22vw; min-height:34vh; padding:2.2vh 1.5vw; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.2vh; border:.14vw solid var(--line); border-radius:1vw; background:#f8fafc; text-align:center; transition:background .35s ease, border-color .35s ease, box-shadow .35s ease; }
    .destination-card svg { width:4vw; height:4vw; color:#475569; transition:color .35s ease; }
    .destination-name { color:var(--text); font-size:1.85vw; font-weight:900; line-height:1.25; }
    .destination-url { max-width:100%; color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:1.5vw; line-height:1.3; overflow-wrap:anywhere; }
    .destination-status { color:var(--success); font-size:1.55vw; font-weight:900; opacity:0; transition:opacity .3s ease; }
    .step-4 .destination-card { border-color:var(--success); background:var(--result); box-shadow:0 .8vh 2vh rgba(22,101,52,.14); }
    .step-4 .destination-card svg { color:var(--success); }
    .step-4 .destination-status { opacity:1; }
    .takeaway { position:absolute; left:50%; bottom:7.1vh; width:74vw; min-height:5.4vh; transform:translateX(-50%); padding:.7vh 1.1vw; display:flex; align-items:center; justify-content:center; border:.1vw solid #bae6fd; border-radius:.65vw; background:#f0f9ff; color:#075985; font-size:1.55vw; line-height:1.3; font-weight:900; text-align:center; }
    .step-0 .takeaway, .step-1 .takeaway, .step-2 .takeaway { opacity:0; }
    .step-3 .takeaway, .step-4 .takeaway { opacity:1; }
    .step-rail { position:absolute; left:50%; bottom:.2vh; z-index:20; display:flex; align-items:center; gap:.45vw; transform:translateX(-50%); }
    .step-node { min-width:9vw; min-height:5.1vh; padding:.4vh .65vw; border:.1vw solid var(--line); border-radius:.55vw; background:#fff; color:var(--muted); font-family:inherit; font-size:1.42vw; font-weight:900; line-height:1.1; cursor:pointer; transition:color .24s ease, background .24s ease, border-color .24s ease, transform .24s ease; }
    .step-node.active { color:#fff; background:var(--primary); border-color:var(--primary); transform:translateY(-.3vh); }
    .step-node .sub { display:block; margin-top:.25vh; font-size:1.5vw; font-weight:700; white-space:nowrap; }
    .step-arrow { color:var(--muted); font-size:1.7vw; font-weight:900; }
    .progress { position:absolute; right:.3vw; bottom:.3vh; z-index:20; display:flex; gap:.45vw; }
    .progress span { width:.6vw; height:.6vw; border-radius:50%; background:var(--line); transition:width .24s ease, background .24s ease; }
    .progress span.active { width:1.8vw; border-radius:99vw; background:var(--primary); }
    .img-overlay { position:fixed; inset:0; z-index:9999; display:none; align-items:center; justify-content:center; background:rgba(2,6,23,.9); cursor:zoom-out; }
    .img-overlay.active { display:flex; }
    .img-overlay img { max-width:92vw; max-height:92vh; object-fit:contain; border-radius:.7vw; }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <div class="ppt-container"><div class="slide" id="slide">
    <header class="page-header"><h1 class="page-title" data-slot="title">图片资产处理流水线</h1></header>
    <main class="content-area" data-template="image-filter-upload" data-step="0" data-max-step="4">
      <p class="lead" data-slot="lead">图片池经过筛选与处理后，形成可交付的目标集合。</p>
      <div class="workflow-stage" id="workflowStage">
        <div class="pool-phase">
          <div class="pool-label">图片池</div>
          <div class="filter-banner" data-filter-label></div>
          <div class="transform-banner" data-transform-label></div>
          <div class="image-pool" data-image-pool></div>
        </div>
        <div class="delivery-phase" aria-hidden="true">
          <div class="selected-frame"><p class="selected-heading">目标集合</p><div class="selected-grid" data-selected-grid></div></div>
          <div class="delivery-arrow" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 32h45M40 18l14 14-14 14"/></svg></div>
          <div class="destination-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="6" rx="1.2"/><rect x="2" y="15" width="20" height="6" rx="1.2"/><path d="M6 6h.01M6 18h.01"/></svg><div class="destination-name" data-destination></div><div class="destination-url" data-destination-url></div><div class="destination-status" data-success-label></div></div>
        </div>
        <div class="takeaway" data-slot="takeaway"></div>
        <div class="step-rail"><button class="step-node active" type="button" data-step-target="0">图片池<span class="sub">混合输入</span></button><span class="step-arrow">→</span><button class="step-node" type="button" data-step-target="1">筛选<span class="sub">目标条件</span></button><span class="step-arrow">→</span><button class="step-node" type="button" data-step-target="2">处理<span class="sub">统一动作</span></button><span class="step-arrow">→</span><button class="step-node" type="button" data-step-target="3">整理<span class="sub">目标集合</span></button><span class="step-arrow">→</span><button class="step-node" type="button" data-step-target="4">交付<span class="sub">结果状态</span></button></div>
        <div class="progress"><span class="active"></span><span></span><span></span><span></span><span></span></div>
      </div>
    </main>
  </div></div>
  <div class="img-overlay" id="imgOverlay"><img id="imgOverlayTarget" alt="放大的图片"></div>
  <script type="application/json" id="template-data">{
    "title":"图片资产处理流水线",
    "lead":"图片池经过筛选与处理后，形成可交付的目标集合。",
    "sourceImages":[
      {"src":"assets/heng1.png","alt":"宽屏素材一","group":"宽屏素材","target":false},
      {"src":"assets/heng2.png","alt":"宽屏素材二","group":"宽屏素材","target":false},
      {"src":"assets/heng3.png","alt":"宽屏素材三","group":"宽屏素材","target":false},
      {"src":"assets/shu1.png","alt":"竖版素材一","group":"竖版素材","target":true},
      {"src":"assets/heng4.png","alt":"宽屏素材四","group":"宽屏素材","target":false},
      {"src":"assets/shu2.png","alt":"竖版素材二","group":"竖版素材","target":true},
      {"src":"assets/shu3.png","alt":"竖版素材三","group":"竖版素材","target":true},
      {"src":"assets/shu4.png","alt":"竖版素材四","group":"竖版素材","target":true},
      {"src":"assets/shu5.png","alt":"竖版素材五","group":"竖版素材","target":true},
      {"src":"assets/shu6.png","alt":"竖版素材六","group":"竖版素材","target":true}
    ],
    "filterLabel":"保留竖版素材","transformLabel":"统一添加标记","destination":"对象存储","successLabel":"处理完成","destinationUrl":"storage.example.com/assets/2026","takeaway":"筛选条件、处理动作和交付位置共同组成一条可复用的资产流水线。"
  }</script>
  <script>
    (() => {
      const data = JSON.parse(document.getElementById('template-data').textContent);
      const root = document.querySelector('[data-template="image-filter-upload"]');
      const stage = document.getElementById('workflowStage');
      const text = (selector, value, scope = root) => { const node = scope.querySelector(selector); if (node && value != null) node.textContent = value; };
      text('[data-slot="title"]', data.title, document); text('[data-slot="lead"]', data.lead); text('[data-filter-label]', data.filterLabel); text('[data-transform-label]', data.transformLabel || '统一处理'); text('[data-destination]', data.destination); text('[data-success-label]', data.successLabel || '处理完成'); text('[data-destination-url]', data.destinationUrl || ''); text('[data-slot="takeaway"]', data.takeaway || '');
      const images = Array.isArray(data.sourceImages) ? data.sourceImages.slice(0, 10) : [];
      const pool = root.querySelector('[data-image-pool]'); const selected = root.querySelector('[data-selected-grid]');
      const makeCell = (item, role) => { const cell = document.createElement('div'); cell.className = `image-cell${item.target ? ' target' : ''}`; cell.dataset[role === 'source' ? 'sourceImage' : 'selectedImage'] = ''; const img = document.createElement('img'); img.className = 'zoomable'; img.src = item.src; img.alt = item.alt || ''; const label = document.createElement('span'); label.className = 'group-label'; label.textContent = item.group || ''; const process = document.createElement('span'); process.className = 'process-tag'; process.textContent = data.transformLabel || '已处理'; const check = document.createElement('span'); check.className = 'check-tag'; check.textContent = '✓'; cell.append(img, label, process, check); return cell; };
      images.forEach(item => pool.appendChild(makeCell(item, 'source'))); images.filter(item => item.target).slice(0, 6).forEach(item => selected.appendChild(makeCell(item, 'selected')));
      const nodes = [...root.querySelectorAll('[data-step-target]')]; const dots = [...root.querySelectorAll('.progress span')]; let current = 0; const max = Number(root.dataset.maxStep || 4);
      function render(next) { current = Math.max(0, Math.min(max, next)); stage.className = `workflow-stage step-${current}`; root.dataset.step = String(current); nodes.forEach(node => node.classList.toggle('active', Number(node.dataset.stepTarget) === current)); dots.forEach((dot, index) => dot.classList.toggle('active', index === current)); }
      function forward() { if (current < max) render(current + 1); } function backward() { if (current > 0) render(current - 1); }
      stage.addEventListener('click', event => { if (event.target.closest('.step-node,.zoomable,.img-overlay')) return; forward(); });
      nodes.forEach(node => node.addEventListener('click', event => { event.stopPropagation(); render(Number(node.dataset.stepTarget)); }));
      document.addEventListener('keydown', event => { if (['ArrowRight', 'PageDown', ' '].includes(event.key) && current < max) { event.preventDefault(); forward(); } else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(event.key) && current > 0) { event.preventDefault(); backward(); } else if (event.key === 'r' || event.key === 'R') render(0); });
      const overlay = document.getElementById('imgOverlay'); const overlayTarget = document.getElementById('imgOverlayTarget'); root.querySelectorAll('.zoomable').forEach(img => img.addEventListener('click', event => { event.stopPropagation(); overlayTarget.src = img.src; overlayTarget.alt = img.alt; overlay.classList.add('active'); })); overlay.addEventListener('click', () => overlay.classList.remove('active')); document.addEventListener('keydown', event => { if (event.key === 'Escape') overlay.classList.remove('active'); });
      render(0);
    })();
  </script>
</body>
</html>
