<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>抽象概念分幕演进</title>
  <style>
    :root{--text:#0f172a;--muted:#64748b;--primary:#002855;--example:#0284c7;--feature:#c2410c;--mechanism:#166534;--boundary:#9f1239;--line:#cbd5e1;--surface:#fff}
    *{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;background:#fff;color:var(--text);font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}.ppt-container,.slide{width:100%;height:100%}.slide{position:relative;border-top:.7vh solid var(--primary)}.page-header{position:absolute;top:4vh;left:6vw;right:6vw;padding-bottom:1.4vh;border-bottom:.35vh solid var(--primary)}.page-title{margin:0;font-size:2.8vw;line-height:1.15;font-weight:900}.content-area{position:absolute;top:14vh;bottom:8vh;left:6vw;right:6vw;font-size:1.8vw}.lead{margin:0!important;color:var(--muted);font-size:1.65vw;line-height:1.35}.story-stage{position:relative;width:100%;height:69vh;cursor:pointer;user-select:none}.scene{position:absolute;left:0;right:0;top:6.2vh;bottom:6.2vh;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:translateX(3vw);transition:opacity .38s ease,transform .38s ease,visibility .38s ease}.scene.active{opacity:1;visibility:visible;transform:translateX(0)}.scene.exit-left{transform:translateX(-3vw)}.scene-shell{width:82vw;min-height:47vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh}.scene-kicker{font-size:1.55vw;font-weight:900;letter-spacing:.08em;color:var(--muted)}.scene-heading{margin:0!important;font-size:2.5vw;line-height:1.2;font-weight:900;text-align:center}.subject-pill{padding:.8vh 1.3vw;border:.12vw solid var(--example);border-radius:.7vw;background:#f0f9ff;color:#075985;font-size:2.2vw;font-weight:900}.item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw;width:78vw}.item-card{min-height:19vh;padding:2vh 1.3vw;border:.1vw solid var(--line);border-radius:.8vw;background:#fff;box-shadow:0 .6vh 1.5vh rgba(15,23,42,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1vh}.item-card strong{font-size:2vw;line-height:1.2}.item-card span{color:var(--muted);font-size:1.55vw;line-height:1.35}.example-card{border-color:#7dd3fc;background:#f8fdff}.feature-card{border-color:#fdba74;background:#fffaf5}.feature-card strong{color:#9a3412}.feature-link{color:var(--feature);font-size:2.1vw;font-weight:900}.mechanism-flow{display:flex;align-items:center;justify-content:center;gap:.65vw;width:82vw}.mechanism-node{min-width:14vw;min-height:14vh;padding:1.4vh 1vw;border:.12vw solid #86efac;border-radius:.8vw;background:#f0fdf4;color:#14532d;font-size:1.7vw;line-height:1.3;font-weight:900;text-align:center;display:flex;align-items:center;justify-content:center}.mechanism-arrow{color:var(--mechanism);font-size:2.4vw;font-weight:900}.conclusion-box{width:72vw;padding:2.4vh 2vw;border:.14vw solid var(--primary);border-radius:1vw;background:#f8fafc;color:var(--text);font-size:2.1vw;line-height:1.45;font-weight:900;text-align:center;box-shadow:0 .8vh 2vh rgba(0,40,85,.09)}.boundary-box{width:67vw;padding:1.3vh 1.5vw;border:.1vw solid #fda4af;border-radius:.7vw;background:#fff1f2;color:var(--boundary);font-size:1.65vw;line-height:1.35;font-weight:800;text-align:center}.step-rail{position:absolute;left:50%;bottom:.2vh;z-index:10;display:flex;align-items:center;gap:.45vw;transform:translateX(-50%)}.step-node{min-width:11vw;min-height:4vh;padding:.45vh .75vw;border:.1vw solid var(--line);border-radius:.6vw;background:#fff;color:var(--muted);font-family:inherit;font-size:1.5vw;font-weight:900;line-height:1.15;white-space:nowrap;cursor:pointer;transition:color .25s ease,background .25s ease,border-color .25s ease,transform .25s ease}.step-node.active{background:var(--primary);border-color:var(--primary);color:#fff;transform:translateY(-.3vh)}.step-arrow{color:var(--muted);font-size:1.8vw;font-weight:900}.progress{position:absolute;right:.2vw;bottom:.25vh;z-index:10;display:flex;gap:.45vw}.progress span{width:.62vw;height:.62vw;border-radius:50%;background:var(--line);transition:width .25s ease,background .25s ease}.progress span.active{width:1.9vw;border-radius:99vw;background:var(--primary)}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body><div class="ppt-container"><div class="slide"><header class="page-header"><h1 class="page-title" data-title>缓存命中的判断过程</h1></header><main class="content-area" data-template="concept-story-progression" data-step="0" data-max-step="3"><p class="lead" data-lead></p><div class="story-stage" id="storyStage"><section class="scene active" data-scene="0"><div class="scene-shell"><div class="scene-kicker">01 · 直观样例</div><h2 class="scene-heading">多种场景都在复用已有结果</h2><div class="subject-pill" data-subject></div><div class="item-grid" data-examples></div></div></section><section class="scene" data-scene="1"><div class="scene-shell"><div class="scene-kicker">02 · 共同特征</div><h2 class="scene-heading">命中需要同时满足稳定条件</h2><div class="item-grid" data-features></div><div class="feature-link">共同条件决定结果能否复用</div></div></section><section class="scene" data-scene="2"><div class="scene-shell"><div class="scene-kicker">03 · 正式机制</div><h2 class="scene-heading">条件被组织成一条判断链</h2><div class="mechanism-flow" data-mechanism></div></div></section><section class="scene" data-scene="3"><div class="scene-shell"><div class="scene-kicker">04 · 结论与边界</div><div class="conclusion-box" data-conclusion></div><div class="boundary-box" data-boundary></div></div></section><nav class="step-rail"><button class="step-node active" data-target="0">样例观察</button><span class="step-arrow">→</span><button class="step-node" data-target="1">共同特征</button><span class="step-arrow">→</span><button class="step-node" data-target="2">正式机制</button><span class="step-arrow">→</span><button class="step-node" data-target="3">结论边界</button></nav><div class="progress"><span class="active"></span><span></span><span></span><span></span></div></div></main></div></div>
  <script type="application/json" id="template-data">{"title":"缓存命中的判断过程","lead":"缓存通过稳定标识找到可复用结果，减少重复计算。","subject":"缓存命中","examples":[{"label":"相同请求","detail":"参数和资源版本一致"},{"label":"重复查询","detail":"输入条件没有变化"},{"label":"页面资源","detail":"文件内容与版本一致"}],"features":[{"label":"唯一标识","detail":"同一输入生成同一键"},{"label":"有效期限","detail":"结果仍在可用时间内"},{"label":"版本一致","detail":"依赖数据没有更新"}],"mechanism":["生成缓存键","查询缓存记录","校验有效状态","直接返回结果"],"conclusion":"键一致、记录有效、依赖未变化时，缓存可以直接返回已有结果。","boundary":"输入、权限或依赖数据变化后，旧结果必须失效。"}</script>
  <script>(()=>{const data=JSON.parse(document.getElementById('template-data').textContent),root=document.querySelector('[data-template]'),stage=document.getElementById('storyStage');const put=(s,v,p=document)=>{const n=p.querySelector(s);if(n&&v!=null)n.textContent=v};put('[data-title]',data.title);put('[data-lead]',data.lead);put('[data-subject]',data.subject);put('[data-conclusion]',data.conclusion);put('[data-boundary]',data.boundary);const make=(item,cls,attr)=>{const card=document.createElement('div');card.className=`item-card ${cls}`;card.dataset[attr]='';const strong=document.createElement('strong'),span=document.createElement('span');strong.textContent=item.label;span.textContent=item.detail;card.append(strong,span);return card};(data.examples||[]).slice(0,4).forEach(x=>root.querySelector('[data-examples]').appendChild(make(x,'example-card','example')));(data.features||[]).slice(0,4).forEach(x=>root.querySelector('[data-features]').appendChild(make(x,'feature-card','feature')));(data.mechanism||[]).slice(0,5).forEach((x,i,a)=>{const node=document.createElement('div');node.className='mechanism-node';node.dataset.mechanismNode='';node.textContent=x;root.querySelector('[data-mechanism]').appendChild(node);if(i<a.length-1){const arrow=document.createElement('span');arrow.className='mechanism-arrow';arrow.textContent='→';root.querySelector('[data-mechanism]').appendChild(arrow)}});const scenes=[...root.querySelectorAll('[data-scene]')],nodes=[...root.querySelectorAll('[data-target]')],dots=[...root.querySelectorAll('.progress span')];let current=0;function render(next){current=Math.max(0,Math.min(3,next));root.dataset.step=String(current);scenes.forEach((scene,i)=>{scene.classList.toggle('active',i===current);scene.classList.toggle('exit-left',i<current)});nodes.forEach(n=>n.classList.toggle('active',Number(n.dataset.target)===current));dots.forEach((d,i)=>d.classList.toggle('active',i===current))}stage.addEventListener('click',e=>{if(e.target.closest('button'))return;if(current<3)render(current+1)});nodes.forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();render(Number(n.dataset.target))}));document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)&&current<3){e.preventDefault();render(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)&&current>0){e.preventDefault();render(current-1)}});render(0)})();</script>
</body></html>
