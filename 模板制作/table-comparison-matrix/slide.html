<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>横向方案对比表</title>
  <style>
    :root { --text:#1e293b; --muted:#475569; --primary:#002855; --line:#cbd5e1; --surface:#fff; --header-text:#fff; --positive:#166534; --caution:#92400e; }
    * { box-sizing:border-box; }
    body { margin:0; width:100vw; height:100vh; background:#fff; color:var(--text); font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif; }
    .ppt-container, .slide { width:100%; height:100%; }
    .slide { position:relative; background:var(--surface); border-top:0.7vh solid var(--primary); }
    .page-header { position:absolute; top:4vh; left:6vw; right:6vw; padding-bottom:1.4vh; border-bottom:0.35vh solid var(--primary); }
    .page-title { margin:0; font-size:2.5vw; line-height:1.15; font-weight:900; letter-spacing:0; }
    .content-area { position:absolute; top:14vh; bottom:9vh; left:6vw; right:6vw; display:flex; flex-direction:column; font-size:1.8vw; }
    .lead-statement { margin:0 0 2.2vh; padding:1.4vh 1.6vw; border:1px solid var(--line); border-radius:8px; background:#f8fafc; font-size:1.75vw; line-height:1.35; font-weight:600; }
    .table-scroll { flex:1; min-height:0; overflow-y:auto; padding-right:0.5vw; display:flex; align-items:center; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
    .comparison-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:1.65vw; line-height:1.35; }
    .comparison-table th, .comparison-table td { border:1px solid var(--line); padding:1.12vh 0.9vw; text-align:left; vertical-align:middle; overflow-wrap:anywhere; }
    .comparison-table th { background:var(--primary); color:var(--header-text); font-size:1.7vw; font-weight:700; }
    .comparison-table th:first-child, .comparison-table td:first-child { width:17%; font-weight:700; }
    .comparison-table tbody tr:nth-child(even) { background:#f8fafc; }
    .comparison-table .status { display:inline-block; padding:0.22em 0.5em; border-radius:4px; font-weight:700; }
    .comparison-table .status.positive { color:var(--positive); background:#ecfdf5; }
    .comparison-table .status.caution { color:var(--caution); background:#fffbeb; }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <div class="ppt-container"><div class="slide">
    <header class="page-header"><h1 class="page-title" data-slot="title">传输方式对比</h1></header>
    <main class="content-area" data-template="table-comparison-matrix">
      <div class="lead-statement" data-slot="lead">同一组评价维度下比较不同传输方案，突出适用边界和迁移成本。</div>
      <div class="table-scroll"><table class="comparison-table"><colgroup></colgroup><thead><tr data-columns></tr></thead><tbody data-rows></tbody></table></div>
    </main>
  </div></div>
  <script type="application/json" id="template-data">
    {"title":"传输方式对比","lead":"同一组评价维度下比较不同传输方案，突出适用边界和迁移成本。","dimensionLabel":"对比项","options":["本地标准 IO","流式 HTTP","旧版 HTTP+SSE"],"rows":[{"label":"当前状态","cells":[{"text":"正式标准","tone":"positive"},{"text":"正式标准","tone":"positive"},{"text":"旧版兼容","tone":"caution"}]},{"label":"服务形态","cells":["Client 启动的本地子进程","独立 HTTP 服务","独立 HTTP 服务"]},{"label":"通信范围","cells":["本机进程间","本机或远程网络","远程网络"]},{"label":"多客户端","cells":["通常一进程一连接","支持多 Client","支持，架构较旧"]},{"label":"身份认证","cells":["依赖本机权限","API Key、OAuth 等","自行实现"]},{"label":"适用场景","cells":["本地工具、课堂实验","企业服务、云端部署","旧系统兼容"]}]}
  </script>
  <script>
    (() => {
      const data = JSON.parse(document.getElementById('template-data').textContent);
      const root = document.querySelector('[data-template="table-comparison-matrix"]');
      const scope = root.closest('.slide') || document;
      const setText = (selector, value, parent = root) => { const node = parent.querySelector(selector); if (node && value != null) node.textContent = value; };
      setText('[data-slot="title"]', data.title, scope); setText('[data-slot="lead"]', data.lead);
      const options = Array.isArray(data.options) ? data.options.slice(0, 5) : [];
      const colgroup = root.querySelector('colgroup'); const header = root.querySelector('[data-columns]');
      const firstCol = document.createElement('col'); firstCol.style.width = '17%'; colgroup.appendChild(firstCol);
      const optionWidth = 83 / Math.max(1, options.length); options.forEach(option => { const col = document.createElement('col'); col.style.width = `${optionWidth}%`; colgroup.appendChild(col); const th = document.createElement('th'); th.textContent = option; header.appendChild(th); });
      const dimension = document.createElement('th'); dimension.textContent = data.dimensionLabel || '对比项'; header.insertBefore(dimension, header.firstChild);
      const tbody = root.querySelector('[data-rows]');
      (Array.isArray(data.rows) ? data.rows.slice(0, 8) : []).forEach(row => { const tr = document.createElement('tr'); tr.dataset.comparisonRow = ''; const label = document.createElement('td'); label.textContent = row.label || ''; tr.appendChild(label); options.forEach((_, index) => { const cell = (row.cells || [])[index]; const td = document.createElement('td'); if (cell && typeof cell === 'object') { const status = document.createElement('span'); status.className = `status ${cell.tone === 'positive' || cell.tone === 'caution' ? cell.tone : ''}`.trim(); status.textContent = cell.text || '—'; td.appendChild(status); } else td.textContent = cell || '—'; tr.appendChild(td); }); tbody.appendChild(tr); });
    })();
  </script>
</body>
</html>
