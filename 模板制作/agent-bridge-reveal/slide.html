<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>执行层连接用户意图与系统动作</title>
  <link rel="stylesheet" href="../../content.css">
  <style>
    [data-template="agent-bridge-reveal"] .lead-hidden { opacity: 0; pointer-events: none; transition: opacity .5s ease; }
    [data-template="agent-bridge-reveal"] .lead-hidden.on { opacity: 1; pointer-events: auto; }
    [data-template="agent-bridge-reveal"] .scene { width: 100%; }
    [data-template="agent-bridge-reveal"] .scene svg { display: block; width: 100%; height: auto; }
    [data-template="agent-bridge-reveal"] .scene-label { font-size: 2.2vw; font-weight: 700; fill: var(--bridge-text, #1e293b); }
    [data-template="agent-bridge-reveal"] .box-title { font-size: 1.8vw; font-weight: 700; fill: var(--bridge-muted, #64748b); }
    [data-template="agent-bridge-reveal"] .item-label { font-size: 1.5vw; font-weight: 600; fill: var(--bridge-text, #334155); }
    [data-template="agent-bridge-reveal"] .relationship-label { font-size: 1.45vw; font-weight: 600; fill: var(--bridge-muted, #64748b); }
    [data-template="agent-bridge-reveal"] #personG, [data-template="agent-bridge-reveal"] #modelG { transition: transform .6s ease; }
    [data-template="agent-bridge-reveal"] #mainLine { transition: x1 .6s ease, x2 .6s ease; }
    [data-template="agent-bridge-reveal"] #agentBoxG { opacity: 0; transition: opacity .4s ease; }
    [data-template="agent-bridge-reveal"] #agentBoxG.on { opacity: 1; }
    [data-template="agent-bridge-reveal"] #agentBoxG .box-pop { transform: scale(.8); transform-box: fill-box; transform-origin: center; transition: transform .4s cubic-bezier(.34,1.56,.64,1); }
    [data-template="agent-bridge-reveal"] #agentBoxG.on .box-pop { transform: none; }
    [data-template="agent-bridge-reveal"] #agentBox { transition: x .5s ease, width .5s ease; }
    [data-template="agent-bridge-reveal"] .bridge-item { opacity: 0; transition: opacity .4s ease, transform .5s ease; }
    [data-template="agent-bridge-reveal"] .bridge-item.on { opacity: 1; }
    [data-template="agent-bridge-reveal"] .bridge-item.unused { display: none; }
    [data-template="agent-bridge-reveal"] .term { color: var(--bridge-primary, #1e40af); font-weight: 700; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { [data-template="agent-bridge-reveal"] * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="ppt-container">
    <div class="slide" data-theme="bridge" style="--bridge-text:#1e293b;--bridge-muted:#64748b;--bridge-primary:#1e40af;--bridge-line:#cbd5e1;--bridge-surface:#fff;">
      <div class="page-header"><h1 class="page-title" data-slot="title">执行层连接用户意图与系统动作</h1></div>
      <div class="content-area" data-template="agent-bridge-reveal" data-step="0" data-max-step="3">
        <div class="lead-statement lead-hidden" data-lead data-slot="lead">外部系统通常不会直接执行模型输出，中间需要一个负责解析、调用和回填结果的执行层。</div>
        <div class="scene">
          <svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" aria-label="两端角色与中心执行层关系图">
            <line id="mainLine" x1="450" y1="160" x2="750" y2="160" stroke="var(--bridge-line)" stroke-width="4" stroke-dasharray="10 8"/>
            <g id="personG" data-left-actor style="transform:translate(254px,0)"><circle cx="110" cy="122" r="38" fill="var(--bridge-primary)"/><path d="M110 172 C66 172 44 214 44 262 L176 262 C176 214 154 172 110 172 Z" fill="var(--bridge-primary)"/><text x="110" y="302" text-anchor="middle" class="scene-label" data-slot="leftActor">用户</text></g>
            <g id="modelG" data-right-actor style="transform:translate(-235px,0)"><polygon points="964,151 964,169 982,160" fill="var(--bridge-muted)"/><circle cx="1090" cy="155" r="64" fill="var(--bridge-surface)" stroke="var(--bridge-primary)" stroke-width="3"/><text x="1090" y="165" text-anchor="middle" class="box-title" data-slot="rightActor">模型</text><text x="1090" y="302" text-anchor="middle" class="scene-label" data-slot="rightActor">模型</text></g>
            <text id="relationship" x="600" y="40" text-anchor="middle" class="relationship-label" data-slot="relationship">解析指令 · 调用工具 · 回填结果</text>
            <g id="agentBoxG" data-bridge transform="translate(600,0)"><g class="box-pop"><rect id="agentBox" x="-100" y="72" width="200" height="176" rx="14" fill="var(--bridge-surface)" stroke="var(--bridge-primary)" stroke-width="2.5"/><text x="0" y="104" text-anchor="middle" class="box-title" data-slot="bridge">执行层</text><g class="bridge-item" id="itemOne" data-bridge-item="0"><circle cx="0" cy="150" r="32" fill="var(--bridge-primary)"/><text x="0" y="218" text-anchor="middle" class="item-label"></text></g><g class="bridge-item" id="itemTwo" data-bridge-item="1"><circle cx="0" cy="150" r="32" fill="var(--bridge-primary)"/><text x="0" y="218" text-anchor="middle" class="item-label"></text></g><g class="bridge-item" id="itemThree" data-bridge-item="2"><circle cx="0" cy="150" r="32" fill="var(--bridge-primary)"/><text x="0" y="218" text-anchor="middle" class="item-label"></text></g><g class="bridge-item" id="itemFour" data-bridge-item="3"><circle cx="0" cy="150" r="32" fill="var(--bridge-primary)"/><text x="0" y="218" text-anchor="middle" class="item-label"></text></g></g></g>
          </svg>
        </div>
      </div>
    </div>
  </div>
  <script type="application/json" id="template-data">
    {
      "title": "执行层连接用户意图与系统动作",
      "lead": "外部系统通常不会直接执行模型输出，中间需要一个负责解析、调用和回填结果的执行层。",
      "leftActor": {"label": "用户"},
      "rightActor": {"label": "模型"},
      "bridge": {"label": "执行层"},
      "bridgeItems": [{"label": "终端 Agent"}, {"label": "IDE Agent"}, {"label": "平台 Agent"}],
      "relationship": "解析指令 · 调用工具 · 回填结果"
    }
  </script>
  <script>
    (() => {
      const root = document.querySelector('[data-template="agent-bridge-reveal"]');
      const data = JSON.parse(document.getElementById('template-data').textContent);
      const scope = root.closest('.slide') || document;
      const setText = (selector, value) => { if (value != null) scope.querySelectorAll(selector).forEach(node => { node.textContent = value; }); };
      setText('[data-slot="title"]', data.title);
      setText('[data-slot="lead"]', data.lead);
      setText('[data-slot="leftActor"]', data.leftActor && data.leftActor.label);
      setText('[data-slot="rightActor"]', data.rightActor && data.rightActor.label);
      setText('[data-slot="bridge"]', data.bridge && data.bridge.label);
      setText('[data-slot="relationship"]', data.relationship);
      const bridgeItems = Array.isArray(data.bridgeItems) ? data.bridgeItems.slice(0, 4) : [];
      root.querySelectorAll('[data-bridge-item]').forEach((item, index) => {
        const label = item.querySelector('.item-label');
        if (!bridgeItems[index]) { item.classList.add('unused'); return; }
        item.classList.remove('unused');
        label.textContent = bridgeItems[index].label || '';
      });
      const stepCount = bridgeItems.length <= 1 ? 1 : bridgeItems.length === 2 ? 2 : 3;
      root.dataset.maxStep = String(stepCount);
      const lead = root.querySelector('[data-lead]');
      const person = root.querySelector('#personG');
      const model = root.querySelector('#modelG');
      const line = root.querySelector('#mainLine');
      const box = root.querySelector('#agentBoxG');
      const rect = root.querySelector('#agentBox');
      const items = [...root.querySelectorAll('[data-bridge-item]')].filter(item => !item.classList.contains('unused'));
      const maxStep = Number(root.dataset.maxStep || 3);
      let step = 0;
      function setBox(width) { rect.setAttribute('x', String(-width / 2)); rect.setAttribute('width', String(width)); }
      function move(element, x) { element.style.transform = `translate(${x}px, 0px)`; }
      function render(next) {
        step = Math.max(0, Math.min(maxStep, next)); root.dataset.step = String(step);
        lead.classList.toggle('on', step >= 1); move(person, step >= 1 ? 0 : 254); move(model, step >= 1 ? 0 : -235);
        line.setAttribute('x1', step >= 1 ? '200' : '450'); line.setAttribute('x2', step >= 1 ? '980' : '750'); box.classList.toggle('on', step >= 1);
        const visibleCount = step < 1 ? 0 : step === 1 ? Math.min(1, items.length) : step === 2 ? Math.min(3, items.length) : items.length;
        setBox(visibleCount <= 1 ? 200 : visibleCount === 2 ? 330 : visibleCount === 3 ? 470 : 610);
        const offset = visibleCount > 0 ? (visibleCount - 1) / 2 : 0;
        items.forEach((item, index) => { item.classList.toggle('on', index < visibleCount); move(item, (index - offset) * 150); });
      }
      document.addEventListener('click', event => { if (event.target.closest('.term, .popover-overlay, .popover-box')) return; if (step < maxStep) render(step + 1); });
      document.addEventListener('keydown', event => { if (['ArrowRight', ' ', 'PageDown'].includes(event.key) && step < maxStep) { event.preventDefault(); render(step + 1); } if (['ArrowLeft', 'PageUp'].includes(event.key) && step > 0) { event.preventDefault(); render(step - 1); } });
      render(0);
    })();
  </script>
</body>
</html>
