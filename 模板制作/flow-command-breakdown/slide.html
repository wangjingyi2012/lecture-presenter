<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>复合命令拆解流程</title>
  <style>
    :root {
      --text: #1e293b; --muted: #475569; --primary: #1d4ed8;
      --tool: #1d4ed8; --result: #15803d; --emphasis: #f59e0b;
      --line: #94a3b8; --surface: #fff; --code-surface: #f8fafc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 100vw; height: 100vh; background: #fff; color: var(--text); font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", sans-serif; }
    .ppt-container, .slide { width: 100%; height: 100%; }
    .slide { position: relative; background: var(--surface); border-top: 0.7vh solid var(--primary); }
    .page-header { position: absolute; top: 4vh; left: 6vw; right: 6vw; padding-bottom: 1.4vh; border-bottom: 0.35vh solid var(--primary); }
    .page-title { margin: 0; font-size: 2.5vw; line-height: 1.15; font-weight: 900; }
    .content-area { position: absolute; top: 14vh; bottom: 8vh; left: 6vw; right: 6vw; display: grid; grid-template-rows: auto 1fr auto; gap: 1.4vh; }
    .lead-statement { margin: 0; padding: 1.3vh 2vw; text-align: center; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; font-size: 1.75vw; line-height: 1.35; font-weight: 600; }
    .stage { position: relative; min-height: 60vh; }
    .outer-flow { position: absolute; top: 0; left: 50%; width: 70vw; transform: translateX(-50%); display: grid; grid-template-columns: 18% 6% 1fr 6% 24%; align-items: center; gap: 0.4vw; z-index: 1; }
    .outer-flow [data-outer-node], .outer-flow .arrow { opacity: 0; transform: translateX(-0.6vw); transition: opacity 0.32s ease, transform 0.32s ease; }
    .outer-flow [data-outer-node].is-visible, .outer-flow .arrow.is-visible { opacity: 1; transform: translateX(0); }
    .node { padding: 1.5vh 1.4vw; border-radius: 6px; text-align: center; font-size: 1.7vw; font-weight: 700; line-height: 1.3; color: #f1f5f9; background: #1f2937; }
    .node.tool { background: var(--tool); }
    .node.result { background: var(--result); }
    .arrow { color: var(--muted); font-size: 1.8vw; text-align: center; font-weight: 700; }
    .command-detail { position: absolute; top: 10vh; left: 50%; width: 74vw; transform: translateX(-50%); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0.3s; z-index: 2; }
    .command-detail.revealed { opacity: 1; visibility: visible; pointer-events: auto; transform: translateX(-50%); }
    .bash-box { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; background: var(--code-surface); box-shadow: 0 1vh 2.2vh rgba(15, 23, 42, 0.12); padding: 1.6vh 1.8vw; }
    .bash-title { display: block; margin: -1.6vh -1.8vw 1.2vh; padding: 0.8vh 1.2vw; border-bottom: 1px solid #cbd5e1; background: #eef2f7; color: var(--muted); font-size: 1.5vw; font-weight: 700; }
    .bash-content { margin: 0; color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 1.6vw; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
    .command-part { padding: 0.1em 0.3em; border-radius: 3px; transition: background 0.3s ease, box-shadow 0.3s ease; }
    .command-part.active { background: #fef3c7; box-shadow: 0 0 0 1px var(--emphasis); }
    .command-explain { min-height: 6vh; display: flex; align-items: center; justify-content: center; text-align: center; }
    .explain-text { display: none; margin-top: 1vh; padding: 1vh 1.6vw; border: 1px solid #fbbf24; border-radius: 8px; background: #fef3c7; color: #92400e; font-size: 1.7vw; font-weight: 700; }
    .explain-text.active { display: inline-block; }
    .takeaway { min-height: 4vh; text-align: center; font-size: 1.7vw; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="ppt-container"><div class="slide">
    <header class="page-header"><h1 class="page-title" data-slot="title">复合命令的内部流程</h1></header>
    <main class="content-area" data-template="flow-command-breakdown" data-step="0" data-max-step="7">
      <div class="lead-statement" data-slot="lead">一个工具动作内部，也可能串起多个连续操作。</div>
      <div class="stage">
        <div class="outer-flow" data-outer-flow>
          <div class="node" data-outer-node="0">模型判断</div><div class="arrow">→</div>
          <div class="node tool" data-outer-node="1">调用命令工具</div><div class="arrow">→</div>
          <div class="node result" data-outer-node="2">模型接收结果</div>
        </div>
        <section class="command-detail" data-command-detail>
          <div class="bash-box">
            <div class="bash-title" data-command-title>命令内容</div>
            <pre class="bash-content" data-command-content></pre>
            <div class="command-explain"><span class="explain-text" data-explain></span></div>
          </div>
        </section>
      </div>
      <div class="takeaway" data-slot="takeaway">复杂动作可以拆成多个可验证的子步骤</div>
    </main>
  </div></div>
  <script type="application/json" id="template-data">
    {"title":"复合命令的内部流程","lead":"一个工具动作内部，也可能串起多个连续操作。","outerFlow":["模型判断","调用命令工具","模型接收结果"],"command":{"title":"命令内容","parts":[{"code":"find input/ -type f -name '*.jpg'","explain":"筛选出待处理的图片"},{"code":"xargs -I {} convert {} -resize 50% output/{}","explain":"批量调整尺寸并生成输出文件"},{"code":"scp output/*.jpg user@server:/var/www/","explain":"把处理结果上传到服务器"}]},"takeaway":"复杂动作可以拆成多个可验证的子步骤"}
  </script>
  <script>
    (() => {
      const data = JSON.parse(document.getElementById('template-data').textContent);
      const root = document.querySelector('[data-template="flow-command-breakdown"]');
      const setText = (selector, value) => { const node = root.querySelector(selector); if (node && value != null) node.textContent = value; };
      setText('[data-slot="title"]', data.title); setText('[data-slot="lead"]', data.lead); setText('[data-slot="takeaway"]', data.takeaway);
      const outer = Array.isArray(data.outerFlow) ? data.outerFlow.slice(0, 3) : [];
      root.querySelectorAll('[data-outer-node]').forEach((node, index) => { node.textContent = outer[index] || ''; node.dataset.reveal = String(index + 1); });
      root.querySelectorAll('.outer-flow .arrow').forEach((node, index) => { node.dataset.reveal = String(index + 2); });
      const parts = Array.isArray(data.command && data.command.parts) ? data.command.parts.slice(0, 4) : [];
      setText('[data-command-title]', data.command && data.command.title);
      const content = root.querySelector('[data-command-content]');
      parts.forEach((part, index) => { const span = document.createElement('span'); span.className = 'command-part'; span.dataset.commandPart = String(index); span.textContent = part.code || ''; content.appendChild(span); if (index < parts.length - 1) content.appendChild(document.createTextNode('  &&  ')); });
      const detail = root.querySelector('[data-command-detail]'); const explain = root.querySelector('[data-explain]');
      let step = 0; const maxStep = parts.length + 4; root.dataset.maxStep = String(maxStep);
      function render(next) {
        step = Math.max(0, Math.min(maxStep, next)); root.dataset.step = String(step);
        root.querySelectorAll('[data-reveal]').forEach(node => node.classList.toggle('is-visible', Number(node.dataset.reveal) <= step));
        detail.classList.toggle('revealed', step >= 3);
        root.querySelectorAll('[data-command-part]').forEach((part, index) => part.classList.toggle('active', step >= 4 && step - 4 === index && step < maxStep));
        explain.classList.remove('active');
        if (step >= 3 && step < maxStep) { explain.textContent = step === 3 ? '命令由多个连续部分组成' : (parts[Math.min(parts.length - 1, step - 4)]?.explain || ''); explain.classList.add('active'); }
      }
      function advance() { if (step < maxStep) render(step + 1); }
      root.closest('.slide').addEventListener('click', advance);
      document.addEventListener('keydown', event => { if (['ArrowRight', 'PageDown', ' '].includes(event.key) && step < maxStep) { event.preventDefault(); advance(); } else if (['ArrowLeft', 'PageUp'].includes(event.key) && step > 0) { event.preventDefault(); render(step - 1); } });
      render(0);
    })();
  </script>
</body>
</html>
