<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT Catalog Demo</title>
    <link rel="stylesheet" href="catalog.css">
</head>
<body>
    <div class="ppt-container">
        <div class="slide">
            <!-- 页面标题 -->
            <div class="page-header">
                <h1 class="page-title">课程导览</h1>
            </div>

            <!-- 目录列表 -->
            <div class="catalog-container" id="catalog-list">
                <div class="catalog-item"><div class="catalog-index">01</div><div class="catalog-content">目录一</div></div>
                <div class="catalog-item"><div class="catalog-index">02</div><div class="catalog-content">目录二</div></div>
                <div class="catalog-item"><div class="catalog-index">03</div><div class="catalog-content">目录三</div></div>
                <div class="catalog-item"><div class="catalog-index">04</div><div class="catalog-content">目录四</div></div>
            </div>
        </div>
    </div>
</body>
</html>
