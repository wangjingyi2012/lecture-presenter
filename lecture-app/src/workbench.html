<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台 · LectureAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* light terminal (default) */
      --term-bg: #f6f8fa;
      --term-surface: #eaeef2;
      --term-border: #d0d7de;
      --term-fg: #24292f;
      --term-muted: #636c76;
      --term-accent: #0969da;
      --term-green: #1a7f37;
      --term-red: #cf222e;
      --term-yellow: #9a6700;
      --term-dim: #818b98;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --term-bg: #0d1117;
        --term-surface: #161b22;
        --term-border: #30363d;
        --term-fg: #c9d1d9;
        --term-muted: #8b949e;
        --term-accent: #58a6ff;
        --term-green: #3fb950;
        --term-red: #f85149;
        --term-yellow: #d29922;
        --term-dim: #6e7681;
      }
    }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: var(--term-bg); color: var(--term-fg);
      font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, "Cascadia Code", monospace;
      font-size: 13px; line-height: 1.6;
    }
    #wb-root { display: flex; flex-direction: column; height: 100vh; }

    /* header */
    .wb-header { padding: 8px 14px; border-bottom: 1px solid var(--term-border); display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--term-surface); }
    .wb-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .wb-prompt-mark { color: var(--term-accent); font-weight: 700; }
    .wb-header-title { font-weight: 600; font-size: 13px; white-space: nowrap; }
    .wb-header-meta { font-size: 11px; color: var(--term-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wb-header-right { display: flex; align-items: center; gap: 6px; }
    .wb-model { font-size: 11px; padding: 3px 6px; border: 1px solid var(--term-border); border-radius: 4px; background: var(--term-bg); color: var(--term-fg); font-family: inherit; max-width: 150px; }
    .wb-model:focus { outline: none; border-color: var(--term-accent); }
    .wb-clear { font-size: 11px; color: var(--term-muted); background: none; border: 1px solid var(--term-border); cursor: pointer; padding: 3px 8px; border-radius: 4px; font-family: inherit; }
    .wb-clear:hover { background: var(--term-surface); color: var(--term-fg); }

    /* terminal log */
    .term-log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
    .term-log::-webkit-scrollbar { width: 8px; }
    .term-log::-webkit-scrollbar-thumb { background: var(--term-border); border-radius: 4px; }
    .term-empty { color: var(--term-muted); padding: 20px 0; line-height: 1.8; }
    .term-empty .term-empty-accent { color: var(--term-accent); }

    /* log lines */
    .ln { white-space: pre-wrap; word-break: break-word; }
    .ln-user { color: var(--term-accent); }
    .ln-user::before { content: "> "; color: var(--term-accent); }
    .ln-ai { color: var(--term-fg); margin: 6px 0; white-space: normal; }
    .wb-streaming::after { content: "▍"; color: var(--term-accent); animation: wb-caret-blink 0.9s steps(1) infinite; }
    @keyframes wb-caret-blink { 50% { opacity: 0; } }
    .ln-phase { color: var(--term-muted); font-size: 12px; margin: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; }
    .ln-phase::before { content: "◌ "; color: var(--term-accent); }
    .ln-act { color: var(--term-yellow); }
    .ln-act::before { content: "▸ "; color: var(--term-yellow); }
    .ln-ok { color: var(--term-green); }
    .ln-ok::before { content: "✓ "; color: var(--term-green); }
    .ln-err { color: var(--term-red); }
    .ln-err::before { content: "✗ "; color: var(--term-red); }
    .ln-sys { color: var(--term-muted); font-size: 12px; }
    .ln-sys::before { content: "// "; color: var(--term-dim); }
    .ln-muted { color: var(--term-muted); }

    /* diff block */
    .diff { margin: 2px 0 4px 14px; padding: 4px 8px; background: var(--term-surface); border-left: 2px solid var(--term-border); border-radius: 0 4px 4px 0; font-size: 12px; max-height: 220px; overflow-y: auto; }
    .diff .d-add { color: var(--term-green); }
    .diff .d-add::before { content: "+ "; }
    .diff .d-del { color: var(--term-red); }
    .diff .d-del::before { content: "- "; }
    .diff .d-hunk { color: var(--term-dim); }
    .diff .d-more { color: var(--term-muted); font-style: italic; }

    /* rendered final response */
    .markdown-body { line-height: 1.65; overflow-x: auto; }
    .markdown-body > :first-child { margin-top: 0; }
    .markdown-body > :last-child { margin-bottom: 0; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: var(--term-fg); line-height: 1.35; margin: 14px 0 6px; }
    .markdown-body h1 { font-size: 18px; }
    .markdown-body h2 { font-size: 16px; border-bottom: 1px solid var(--term-border); padding-bottom: 4px; }
    .markdown-body h3 { font-size: 14px; }
    .markdown-body p, .markdown-body ul, .markdown-body ol { margin: 6px 0; }
    .markdown-body ul, .markdown-body ol { padding-left: 22px; }
    .markdown-body code { background: var(--term-surface); border: 1px solid var(--term-border); border-radius: 3px; padding: 1px 4px; font-family: inherit; }
    .markdown-body pre { background: var(--term-surface); border: 1px solid var(--term-border); border-radius: 6px; padding: 8px 10px; overflow-x: auto; margin: 8px 0; }
    .markdown-body pre code { border: 0; padding: 0; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--term-border); padding: 5px 7px; text-align: left; vertical-align: top; }
    .markdown-body th { background: var(--term-surface); font-weight: 600; }
    .markdown-body hr { border: 0; border-top: 1px solid var(--term-border); margin: 12px 0; }

    /* input */
    .term-input-area { border-top: 1px solid var(--term-border); padding: 8px 14px; background: var(--term-surface); }
    .slash-menu { flex: 0 1 auto; max-height: min(52vh, 420px); overflow-y: auto; margin: 0 14px 6px; padding: 5px; background: var(--term-bg); border: 1px solid var(--term-border); border-radius: 7px; box-shadow: 0 -8px 24px rgba(0,0,0,0.14); }
    .slash-menu[hidden] { display: none; }
    .slash-menu-head { position: sticky; top: -5px; z-index: 1; display: flex; justify-content: space-between; gap: 8px; padding: 7px 8px; margin-bottom: 3px; border-bottom: 1px solid var(--term-border); background: var(--term-bg); color: var(--term-muted); font-size: 11px; }
    .slash-item { width: 100%; display: grid; grid-template-columns: minmax(125px, auto) 1fr; gap: 12px; align-items: baseline; border: 0; border-radius: 4px; padding: 7px 8px; color: var(--term-fg); background: transparent; font: inherit; text-align: left; cursor: pointer; }
    .slash-item:hover, .slash-item.active { background: var(--term-surface); }
    .slash-name { color: var(--term-accent); font-weight: 650; white-space: nowrap; }
    .slash-desc { color: var(--term-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slash-command-copy { min-width: 0; display: flex; align-items: baseline; }
    .skill-source { flex: 0 0 auto; margin-left: 10px; padding: 0 5px; border: 1px solid var(--term-border); border-radius: 3px; color: var(--term-muted); font-size: 10px; }
    .slash-command-title { color: var(--term-fg); white-space: nowrap; }
    .slash-separator { color: var(--term-dim); white-space: pre; }
    .slash-page-item { grid-template-columns: 60px 1fr; }
    .slash-page-number { color: var(--term-muted); font-size: 11px; white-space: nowrap; }
    .slash-page-copy { min-width: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .slash-page-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slash-empty { padding: 18px 8px; color: var(--term-muted); text-align: center; }
    .term-input-row { display: flex; align-items: flex-end; gap: 8px; }
    .term-input-row .prompt-glyph { color: var(--term-accent); font-weight: 700; padding-bottom: 7px; }
    .term-input-row textarea { flex: 1; background: var(--term-bg); color: var(--term-fg); border: 1px solid var(--term-border); border-radius: 6px; padding: 7px 10px; font-family: inherit; font-size: 13px; line-height: 1.5; resize: none; min-height: 34px; max-height: 160px; }
    .term-input-row textarea:focus { outline: none; border-color: var(--term-accent); }
    .term-input-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; }
    .term-hint { font-size: 11px; color: var(--term-muted); }
    .term-picker-triggers { display: inline-flex; gap: 5px; margin-right: 8px; }
    .term-picker-trigger { padding: 1px 6px; border: 1px solid var(--term-border); border-radius: 4px; background: var(--term-bg); color: var(--term-accent); font: inherit; font-size: 11px; cursor: pointer; }
    .term-picker-trigger:hover { background: var(--term-surface); }
    .term-hint kbd { background: var(--term-bg); border: 1px solid var(--term-border); border-radius: 3px; padding: 0 4px; font-family: inherit; font-size: 10px; }
    .term-send { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--term-accent); background: var(--term-accent); color: #fff; cursor: pointer; font-family: inherit; font-size: 12px; }
    .term-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .wb-pick-btn { margin-top: 10px; padding: 6px 16px; border-radius: 6px; border: 1px solid var(--term-accent); background: var(--term-accent); color: #fff; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; }
    .wb-pick-btn:hover { opacity: 0.9; }
    .wb-pick-actions { display: flex; gap: 8px; justify-content: center; }
    .wb-pick-btn-secondary { background: transparent; color: var(--term-accent); }
    .wb-recent-list { margin-top: 10px; max-height: 260px; overflow-y: auto; text-align: left; }
    .wb-recent-item { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 7px 10px; margin-bottom: 6px; border: 1px solid var(--term-border); border-radius: 6px; background: var(--term-bg); color: var(--term-fg); cursor: pointer; font-family: inherit; text-align: left; }
    .wb-recent-item:hover { border-color: var(--term-accent); }
    .wb-recent-title { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wb-recent-path { font-size: 11px; color: var(--term-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wb-recent-empty { padding: 10px; color: var(--term-muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div id="wb-root">
    <div class="wb-header">
      <div class="wb-header-left">
        <span class="wb-prompt-mark">▌</span>
        <div>
          <div class="wb-header-title">LectureAI 工作台</div>
          <span class="wb-header-meta" id="wb-course-meta">未连接课件</span>
        </div>
      </div>
      <div class="wb-header-right">
        <select id="wb-model" class="wb-model" title="选择 AI 模型"></select>
        <button class="wb-clear" id="wb-clear" title="清空">清空</button>
      </div>
    </div>
    <div class="term-log" id="wb-messages">
      <div class="term-empty">
        <span class="term-empty-accent">LectureAI 工作台</span> · 课件级 Agent<br>
        对整套课件发指令，<span class="term-empty-accent">@3</span> 定位第 3 页<br>
        改完自动保存，主窗口实时预览
      </div>
    </div>
    <div id="wb-slash-menu" class="slash-menu" hidden role="listbox" aria-label="命令与页面候选"></div>
    <div class="term-input-area">
      <div class="term-input-row">
        <span class="prompt-glyph">&gt;</span>
        <textarea id="wb-input" rows="1" placeholder="输入 /、@ 或 $ 查看命令、页面和技能…"></textarea>
        <button class="term-send" id="wb-send">发送 ⏎</button>
        <button class="wb-clear" id="wb-stop" hidden>停止</button>
      </div>
      <div class="term-input-foot">
        <span class="term-hint"><span class="term-picker-triggers"><button type="button" id="wb-command-trigger" class="term-picker-trigger">命令 /</button><button type="button" id="wb-page-trigger" class="term-picker-trigger">页面 @</button><button type="button" id="wb-skill-trigger" class="term-picker-trigger">外接技能 $</button><button type="button" id="wb-skill-import" class="term-picker-trigger">导入 SKILL</button></span><kbd>Enter</kbd> 发送 · <kbd>Shift+Enter</kbd> 换行</span>
      </div>
    </div>
  </div>
  <script src="vendor/marked.min.js"></script>
  <script src="js/ppte-rules-prompt.js"></script>
  <script src="js/ppte-slash-commands.js"></script>
  <script src="js/workbench-window.js"></script>
</body>
</html>
