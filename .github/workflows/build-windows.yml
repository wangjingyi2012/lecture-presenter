name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lecture-app/src-tauri

      - name: Install frontend dependencies
        working-directory: lecture-app
        run: npm install

      - name: Build Tauri app (Windows)
        working-directory: lecture-app
        run: npm run build:release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Prepare release asset
        working-directory: lecture-app
        shell: pwsh
        run: |
          $VERSION = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $EXE = Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $EXE) { Write-Error "No NSIS installer found" }
          Copy-Item $EXE.FullName "release/Lecture-Presenter_${VERSION}_Windows_x64.exe"

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: LecturePresenter-Windows-NSIS
          path: lecture-app/release/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download NSIS artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/*.exe --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" release-assets/*.exe \
              --title "$TAG_NAME" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
